ile dal fegato allo stomaco","Porta il succo pancreatico al digiuno","Porta la bile dalla cistifellea al fegato"],"e":"Il coledoco sbocca nel duodeno, in genere insieme al dotto pancreatico."},{"t":8,"q":"La via biliare extraepatica è formata in sequenza da:","o":["Dotto epatico comune, che riceve il dotto cistico della cistifellea, e prosegue come coledoco","Dotto cistico, che riceve il dotto epatico comune, e prosegue come dotto pancreatico","Dotto coledoco, che riceve il dotto cistico, e prosegue come dotto epatico comune","Dotti epatici, che sboccano nella cistifellea, e prosegue come dotto epatico comune"],"e":"Dopo la confluenza con il dotto cistico il dotto epatico comune prende il nome di coledoco."},{"t":8,"q":"Quale specie è priva di cistifellea?","o":["Cavallo","Cane","Bovino","Suino"],"e":"Nel cavallo la bile fluisce continuamente nel duodeno attraverso il dotto epatico comune."},{"t":8,"q":"Il sangue che giunge al fegato proviene:","o":["Per circa 3/4 dalla vena porta e per 1/4 dall'arteria epatica","Per circa 3/4 dall'arteria epatica e per 1/4 dalla vena porta","In parti uguali dalla vena porta e dall'arteria epatica","Esclusivamente dalla vena porta"],"e":"La vena porta fornisce sangue venoso ricco di nutrienti, l'arteria epatica sangue ossigenato."},{"t":8,"q":"La triade portale è costituita da:","o":["Ramo della vena porta, ramo dell'arteria epatica e condotto biliare","Ramo della vena epatica, ramo dell'arteria epatica e vaso linfatico","Vena centrolobulare, ramo della vena porta e condotto biliare","Ramo della vena porta, sinusoide e canalicolo biliare"],"e":"La triade si trova negli spazi portali agli angoli del lobulo."},{"t":8,"q":"Al centro di ogni lobulo epatico è presente:","o":["La vena centrolobulare","La triade portale","Il dotto biliare interlobulare","L'arteria epatica interlobulare"],"e":"I sinusoidi convergono radialmente nella vena centrolobulare, tributaria delle vene epatiche."},{"t":8,"q":"Segna l'affermazione errata riguardo alle cellule di Kupffer:","o":["Derivano da linfociti B attivati nel sangue","Sono macrofagi residenti dei sinusoidi epatici","Derivano dai monociti circolanti","Fagocitano eritrociti invecchiati e particelle estranee"],"e":"Le cellule di Kupffer appartengono al sistema dei fagociti mononucleati e derivano dai monociti, non dai linfociti."},{"t":9,"q":"Quale tra i seguenti nuclei della base è coinvolto nell'attenzione visiva?","o":["Claustro","Nucleo caudato","Putamen","Globo pallido"],"e":"Risposta della chiave d'esame: il claustro è connesso con le aree corticali sensoriali, in particolare visive."},{"t":9,"q":"Il nucleo genicolato laterale del metatalamo è una stazione:","o":["Della via ottica","Della via acustica","Della via olfattiva","Della via gustativa"],"e":"Il genicolato laterale riceve il tratto ottico; il genicolato mediale è la stazione acustica."},{"t":9,"q":"Il chiasma ottico è parte:","o":["Dell'ipotalamo","Del talamo","Dell'epitalamo","Del mesencefalo"],"e":"Il chiasma ottico si trova sul pavimento del diencefalo, nella regione ipotalamica, rostralmente all'ipofisi."},{"t":9,"q":"Il solco rinale separa:","o":["Il neopallio dal paleopallio","Il neopallio dall'archipallio","Il paleopallio dall'archipallio","Il lobo frontale dal lobo parietale"],"e":"Il solco rinale delimita il lobo piriforme (paleopallio, corteccia olfattiva) dalla neocorteccia sovrastante."},{"t":9,"q":"Il nervo oculomotore è:","o":["Misto: motore somatico e parasimpatico","Esclusivamente motore somatico","Esclusivamente sensitivo","Esclusivamente parasimpatico"],"e":"Innerva la maggior parte dei muscoli estrinseci dell'occhio e porta fibre parasimpatiche per sfintere pupillare e muscolo ciliare."},{"t":9,"q":"Su entrambi i lati del midollo spinale penetrano (emergono):","o":["Le radici dei nervi spinali","I nervi cranici","I peduncoli cerebellari","Le strie olfattorie"],"e":"Le radici dorsali (sensitive) entrano e le radici ventrali (motorie) escono da ciascun lato del midollo."},{"t":9,"q":"L'epifisi (ghiandola pineale) è parte:","o":["Dell'epitalamo","Dell'ipotalamo","Del metatalamo","Del subtalamo"],"e":"L'epitalamo comprende epifisi, abenule e commessura abenulare."},{"t":9,"q":"Le cellule associative della sostanza grigia del midollo spinale:","o":["Collegano altre cellule nervose tramite rami ascendenti e discendenti","Innervano direttamente la muscolatura striata degli arti","Ricevono le fibre sensitive dai gangli spinali e le proiettano al talamo","Formano la guaina mielinica degli assoni del midollo"],"e":"Gli interneuroni collegano segmenti midollari diversi e integrano l'attività riflessa."},{"t":9,"q":"L'intumescenza lombare è:","o":["L'ispessimento del midollo spinale da cui si dipartono i nervi diretti agli arti posteriori","L'ispessimento del midollo spinale da cui si dipartono i nervi diretti agli arti anteriori","La dilatazione del canale centrale nella regione lombare","L'ispessimento delle meningi a livello lombare"],"e":"Le intumescenze cervicale e lombare corrispondono all'origine dei plessi per gli arti."},{"t":9,"q":"Il tegmento pontino:","o":["È la parte dorsale del ponte","È la parte ventrale del ponte","È la parte dorsale del mesencefalo","È la parte ventrale del midollo allungato"],"e":"Il ponte ha una parte ventrale (fibre trasverse e nuclei pontini) e una dorsale, il tegmento, con nuclei dei nervi cranici e formazione reticolare."},{"t":9,"q":"Non è presente o è rudimentale nel primo nervo cervicale:","o":["Il ganglio spinale","La radice ventrale","Il ramo ventrale","Il ramo dorsale"],"e":"Il primo nervo cervicale ha una radice dorsale ridotta o assente e quindi ganglio spinale rudimentale."},{"t":9,"q":"Il nucleo rosso del mesencefalo è il principale attore del tratto:","o":["Rubrospinale","Corticospinale","Reticolospinale","Vestibolospinale"],"e":"Il tratto rubrospinale, molto sviluppato negli animali domestici, controlla la muscolatura flessoria degli arti."},{"t":9,"q":"Le fibre rampicanti della corteccia cerebellare sono costituite da:","o":["Fibre olivari (olivocerebellari)","Fibre pontine (pontocerebellari)","Fibre vestibolari","Fibre spinocerebellari"],"e":"Le fibre rampicanti nascono dal nucleo olivare inferiore e contattano direttamente i dendriti delle cellule di Purkinje; le altre afferenze sono fibre muscoidi."},{"t":9,"q":"Segna l'affermazione errata riguardo alla lamina quadrigemina:","o":["È parte del midollo spinale","È la parte dorsale (tetto) del mesencefalo","Comprende i collicoli rostrali e caudali","È coinvolta nei riflessi visivi e acustici"],"e":"La lamina quadrigemina è il tetto del mesencefalo, non una struttura midollare."},{"t":9,"q":"La sostanza bianca del cervelletto è detta:","o":["Arbor vitae","Corpo calloso","Corona radiata","Capsula interna"],"e":"In sezione sagittale la sostanza bianca cerebellare ramificata ricorda un albero."},{"t":9,"q":"Nel tratto spinocerebellare dorsale la fibra ascendente attraversa:","o":["Il peduncolo cerebellare caudale (inferiore)","Il peduncolo cerebellare rostrale (superiore)","Il peduncolo cerebellare medio","Il corpo calloso"],"e":"Lo spinocerebellare dorsale entra dal peduncolo caudale; quello ventrale dal peduncolo rostrale."},{"t":9,"q":"Tra i lobi del cervelletto, assicura la connessione con il midollo spinale:","o":["Paleocerebello","Archicerebello","Neocerebello","Flocculo"],"e":"Il paleocerebello (spinocerebello) riceve le vie spinocerebellari; l'archicerebello è vestibolare, il neocerebello cortico-pontino."},{"t":9,"q":"Il lemnisco mediale decorre nel ponte e nel mesencefalo fino a raggiungere:","o":["Il nucleo ventrale caudale (posteriore) del talamo","Il nucleo genicolato laterale del talamo","Il nucleo rosso del mesencefalo","Il nucleo dentato del cervelletto"],"e":"Il lemnisco mediale porta la sensibilità propriocettiva cosciente e tattile discriminativa al talamo, che la proietta alla corteccia."},{"t":9,"q":"Quale di questi tratti della via ascendente spinocerebellare decussa?","o":["Spinocerebellare ventrale","Spinocerebellare dorsale","Cuneocerebellare","Spino-olivare"],"e":"Lo spinocerebellare ventrale decussa nel midollo e di nuovo nel cervelletto, tornando omolaterale; il dorsale resta omolaterale."},{"t":10,"q":"I movimenti di traslazione su linea retta (accelerazione lineare) sono rilevati da:","o":["Utricolo e sacculo","Canali semicircolari","Coclea","Organo del Corti"],"e":"Le macule di utricolo e sacculo, con gli otoliti, rilevano gravità e accelerazioni lineari."},{"t":10,"q":"I movimenti di rotazione sull'asse (accelerazione angolare) sono rilevati da:","o":["Canali semicircolari","Utricolo e sacculo","Coclea","Timpano"],"e":"Le creste ampollari dei tre canali semicircolari rilevano le rotazioni della testa sui tre piani."},{"t":10,"q":"Quale tra le seguenti parti non si trova all'interno dell'orecchio interno?","o":["Timpano","Coclea","Utricolo","Canali semicircolari"],"e":"La membrana del timpano separa orecchio esterno e medio."},{"t":10,"q":"Segna l'affermazione errata riguardo alle cellule dell'apparato sensoriale uditivo:","o":["Comprende le cellule dell'utricolo","Comprende le cellule ciliate interne dell'organo del Corti","Comprende le cellule ciliate esterne dell'organo del Corti","Comprende le cellule di sostegno dell'organo del Corti"],"e":"L'utricolo appartiene all'apparato vestibolare, non a quello uditivo."},{"t":10,"q":"La cartilagine scutiforme del padiglione auricolare è importante perché:","o":["Permette l'impianto dei muscoli auricolari","Delimita il meato acustico esterno","Sostiene la membrana del timpano","Protegge la catena degli ossicini"],"e":"La scutiforme è una piastra cartilaginea rostrale al padiglione su cui si inseriscono i muscoli che lo muovono."},{"t":10,"q":"La coclea si trova:","o":["Nell'orecchio interno","Nell'orecchio medio","Nell'orecchio esterno","Nella tuba uditiva"],"e":"La coclea fa parte del labirinto osseo e membranoso dell'orecchio interno."},{"t":10,"q":"Il primo ossicino della catena ossiculare partendo dal timpano è:","o":["Martello","Incudine","Staffa","Lenticolare"],"e":"Il manico del martello è inserito nella membrana del timpano; seguono incudine e staffa."},{"t":10,"q":"Il dotto cocleare contiene:","o":["Endolinfa","Perilinfa","Liquido cerebrospinale","Aria"],"e":"Il labirinto membranoso contiene endolinfa; le rampe vestibolare e timpanica contengono perilinfa."},{"t":10,"q":"L'apparato di meccanotrasduzione delle cellule di I e II tipo degli epiteli sensoriali dell'orecchio si avvale di:","o":["Lunghi microvilli (stereociglia)","Ciglia mobili","Dendriti liberi","Sinapsi elettriche"],"e":"Le stereociglia, deflesse dal movimento dei liquidi o degli otoliti, aprono canali ionici e depolarizzano la cellula."},{"t":10,"q":"La perilinfa è in continuità con:","o":["Lo spazio subaracnoideo","La cavità dell'orecchio medio","Il dotto endolinfatico","La tuba uditiva"],"e":"L'acquedotto della coclea collega lo spazio perilinfatico allo spazio subaracnoideo."},{"t":10,"q":"L'organo del Corti si trova:","o":["Nella coclea (dotto cocleare)","Nell'utricolo","Nel sacculo","Nei canali semicircolari"],"e":"L'organo del Corti poggia sulla membrana basilare del dotto cocleare."},{"t":10,"q":"I nuclei vestibolari sono:","o":["4 paia","2 paia","6 paia","1 paio"],"e":"Nuclei vestibolari rostrale, caudale, mediale e laterale, situati nel midollo allungato e nel ponte."},{"t":10,"q":"Nel cavallo le tasche gutturali sono:","o":["Diverticoli delle tube uditive, che si aprono da un recesso ventrale delle stesse","Diverticoli della cavità nasale, che si aprono dal meato ventrale","Recessi della cavità dell'orecchio medio","Diverticoli della faringe laringea"],"e":"Le tasche gutturali sono ampi diverticoli mucosi delle tube uditive, tipici degli Equidi."},{"t":11,"q":"Quale porzione dell'occhio ha un aspetto a mosaico se osservata al microscopio speculare?","o":["Endotelio corneale","Epitelio corneale","Epitelio pigmentato della retina","Epitelio del cristallino"],"e":"L'endotelio corneale è un monostrato di cellule esagonali che regola l'idratazione della cornea."},{"t":11,"q":"Quale specie non ha il tappeto lucido?","o":["Suino","Cane","Cavallo","Bovino"],"e":"Il suino è privo di tappeto lucido; carnivori, equini e ruminanti lo possiedono."},{"t":11,"q":"Quale tra questi NON è una membrana (tunica) del bulbo oculare?","o":["Pupilla","Sclera","Coroide","Retina"],"e":"La pupilla è l'apertura dell'iride, non una tunica; le tuniche sono fibrosa, vascolare e nervosa."},{"t":11,"q":"I coni presenti nella retina sono responsabili:","o":["Della visione diurna e dei colori","Della visione notturna e in bianco e nero","Della visione periferica in condizioni di scarsa luce","Della trasmissione dell'impulso al nervo ottico"],"e":"I coni funzionano con luce intensa e discriminano i colori; i bastoncelli sono per la visione crepuscolare."},{"t":11,"q":"Da cosa dipende la posizione dei muscoli circolare e radiale dell'iride?","o":["Dalla specie","Dall'età dell'animale","Dall'intensità della luce","Dal colore dell'iride"],"e":"La disposizione dei muscoli iridei varia con la specie, in relazione alla forma della pupilla."},{"t":11,"q":"La rodopsina è:","o":["Il pigmento dei bastoncelli","Il pigmento dei coni","Il pigmento dell'epitelio pigmentato","Il pigmento del tappeto lucido"],"e":"La rodopsina (opsina più retinale) è il fotopigmento dei bastoncelli."},{"t":11,"q":"Quale specie è caratterizzata da un tappeto lucido cellulare?","o":["Carnivori","Equini","Ruminanti","Suini"],"e":"Nei carnivori il tappeto lucido è cellulare (cellule con cristalli riflettenti); negli erbivori è fibroso."},{"t":11,"q":"La capacità di mettere a fuoco alle diverse distanze dipende:","o":["Dal cristallino","Dalla cornea","Dalla pupilla","Dal corpo vitreo"],"e":"L'accomodazione avviene modificando la curvatura del cristallino tramite il muscolo ciliare."},{"t":11,"q":"La zona dell'iride in cui sono presenti i muscoli radiali e circolari si chiama:","o":["Zona pupillare","Zona ciliare","Zona limbare","Zona equatoriale"],"e":"Risposta della chiave d'esame."},{"t":11,"q":"La parte centrale della retina è detta:","o":["Fovea","Papilla ottica","Ora serrata","Limbo"],"e":"L'area centrale (fovea) ha la massima densità di fotorecettori; la papilla ottica è il punto cieco."},{"t":11,"q":"Segna l'affermazione errata riguardo alle zone del cristallino:","o":["Comprende uno stroma","Comprende una capsula","Comprende un epitelio","Comprende un nucleo"],"e":"Il cristallino è formato da capsula, epitelio, corteccia e nucleo; lo stroma è un termine proprio della cornea."},{"t":11,"q":"Dove si trovano i recettori della luce che danno inizio alla via che stimola la ghiandola pineale?","o":["Nella retina","Nella cornea","Nella ghiandola pineale stessa","Nell'ipotalamo"],"e":"La via retino-ipotalamica informa il nucleo soprachiasmatico, che regola la secrezione di melatonina."},{"t":11,"q":"L'epitelio pigmentato (strato più periferico) della retina:","o":["Non è pigmentato nelle zone corrispondenti al tappeto lucido","È pigmentato soltanto nelle zone corrispondenti al tappeto lucido","È privo di pigmento in tutte le specie con tappeto lucido","È pigmentato uniformemente in tutte le specie"],"e":"Sopra il tappeto lucido l'epitelio è privo di melanina, così la luce può raggiungere lo strato riflettente."},{"t":11,"q":"Il corpo vitreo si trova:","o":["Nel segmento posteriore (camera vitrea) del bulbo","Nella camera anteriore","Nella camera posteriore, tra iride e cristallino","Tra cornea e iride"],"e":"Le camere anteriore e posteriore contengono umore acqueo; il vitreo occupa lo spazio dietro il cristallino."},{"t":11,"q":"Negli animali diurni sono più rappresentati:","o":["I coni","I bastoncelli","Le cellule gangliari","Le cellule di Müller"],"e":"Gli animali notturni hanno retine dominate dai bastoncelli, più sensibili alla luce."},{"t":12,"q":"Quale struttura è definita il «terzo occhio»?","o":["La ghiandola pineale (epifisi)","La neuroipofisi","Il corpo genicolato laterale","Il chiasma ottico"],"e":"Nei vertebrati inferiori la pineale è direttamente fotosensibile; nei mammiferi riceve informazioni luminose dalla retina."},{"t":12,"q":"Quale zona è più rappresentata nella corticale del surrene?","o":["Zona fascicolata","Zona glomerulare","Zona reticolare","Zona midollare"],"e":"La fascicolata, che produce glucocorticoidi, occupa la maggior parte dello spessore corticale."},{"t":12,"q":"I neuroni simpatici pregangliari destinati alla midollare del surrene liberano:","o":["Acetilcolina","Noradrenalina","Adrenalina","Dopamina"],"e":"Le fibre pregangliari sono colinergiche; le cellule cromaffini, equivalenti a neuroni postgangliari, liberano catecolamine."},{"t":12,"q":"Le mammelle:","o":["Sono meno rilevate nei soggetti sessualmente immaturi","Sono più rilevate nei soggetti sessualmente immaturi","Hanno lo stesso sviluppo indipendentemente dalla maturità sessuale","Sono presenti soltanto nelle femmine dopo la prima gravidanza"],"e":"Lo sviluppo del parenchima mammario dipende dagli ormoni sessuali e si completa con pubertà e gravidanza."},{"t":12,"q":"Qual è il precursore diretto della melatonina?","o":["Serotonina","Dopamina","Triptofano","Noradrenalina"],"e":"Il triptofano è convertito in serotonina, che i pinealociti trasformano in melatonina."},{"t":12,"q":"Quali cellule producono la calcitonina?","o":["Cellule parafollicolari (C)","Cellule follicolari","Cellule ossifile","Cellule principali delle paratiroidi"],"e":"Le cellule C della tiroide secernono calcitonina, ipocalcemizzante; le principali delle paratiroidi secernono paratormone."},{"t":12,"q":"Il lume dei follicoli tiroidei contiene:","o":["Colloide","Endolinfa","Liquido follicolare","Muco"],"e":"La colloide è costituita da tireoglobulina, deposito degli ormoni tiroidei."},{"t":13,"q":"Gli addensamenti localizzati di ectoderma che si accrescono nel mesenchima costituiscono:","o":["Le gemme epiteliali da cui si differenziano peli e ghiandole","Le papille dermiche da cui si differenziano i vasi","I follicoli linfatici da cui si differenziano i linfociti","Le lamine basali da cui si differenzia il derma"],"e":"Gli annessi cutanei derivano dall'ectoderma che si invagina nel mesenchima sottostante."},{"t":13,"q":"I melanociti:","o":["Producono i pigmenti che determinano la colorazione del pelo","Producono la cheratina che costituisce il fusto del pelo","Producono il sebo che lubrifica il pelo","Producono il collagene del derma"],"e":"La melanina viene trasferita dai melanociti alle cellule in cheratinizzazione del pelo."},{"t":13,"q":"I melanociti del pelo si trovano:","o":["Nel derma del follicolo","Nello strato corneo dell'epidermide","Nel tessuto adiposo sottocutaneo","Nella ghiandola sebacea"],"e":"Risposta della chiave d'esame."},{"t":13,"q":"I componenti del pelo sono:","o":["Fusto, radice e bulbo","Fusto, cuticola e midollo","Radice, papilla e derma","Bulbo, follicolo e ghiandola sebacea"],"e":"Il fusto sporge dalla cute, la radice è nel follicolo e termina con il bulbo, che accoglie la papilla dermica."},{"t":13,"q":"L'ordine corretto dei quattro strati dell'epidermide, partendo dalla superficie esterna, è:","o":["Corneo, granuloso, spinoso, basale","Basale, spinoso, granuloso, corneo","Corneo, spinoso, granuloso, basale","Granuloso, corneo, spinoso, basale"],"e":"Le cellule nascono nello strato basale e maturano verso la superficie fino a desquamare dallo strato corneo."},{"t":13,"q":"È formata da mesotelio e lamina connettivale:","o":["La tonaca sierosa","La tonaca mucosa","La tonaca avventizia","La tonaca muscolare"],"e":"Le sierose (pleura, pericardio, peritoneo) sono rivestite da mesotelio; l'avventizia è solo connettivo."},{"t":13,"q":"Gli adenomeri delle ghiandole esocrine sono avvolti da:","o":["Cellule mioepiteliali","Cellule endoteliali","Periciti","Cellule mesoteliali"],"e":"Le cellule mioepiteliali, contrattili, si trovano tra le cellule secernenti e la membrana basale e favoriscono l'espulsione del secreto."},{"t":13,"q":"Segna l'affermazione errata riguardo all'endotelio:","o":["Il glicocalice esterno dell'endotelio è carico positivamente","L'endotelio è un epitelio pavimentoso semplice","Il glicocalice contribuisce alla selettività della filtrazione glomerulare","L'endotelio esprime il fattore di von Willebrand"],"e":"Il glicocalice endoteliale è carico negativamente e respinge le molecole anioniche."},{"t":13,"q":"Lo spessore di una sezione istologica al microtomo è di:","o":["5-10 µm","50-100 µm","0,5-1 µm","1-2 mm"],"e":"Sezioni di pochi micrometri sono necessarie perché la luce attraversi il preparato."},{"t":13,"q":"L'utilizzo di anticorpi secondari coniugati alla perossidasi di rafano si impiega principalmente in:","o":["Tecniche di immunoistochimica","Colorazioni istochimiche con ematossilina-eosina","Tecniche di impregnazione argentica","Microscopia elettronica a trasmissione"],"e":"La perossidasi legata all'anticorpo secondario converte un substrato cromogeno rendendo visibile l'antigene."},{"t":13,"q":"La fissazione di un campione per preparazione istologica avviene tramite l'uso di:","o":["Formalina","Xilene","Paraffina","Etanolo assoluto"],"e":"La formalina crea legami crociati tra le proteine, bloccando l'autolisi; xilene e paraffina servono per chiarificazione e inclusione."},{"t":13,"q":"Il fattore di von Willebrand è un marker istologico:","o":["Delle cellule endoteliali","Delle cellule muscolari lisce","Dei fibroblasti","Dei mastociti"],"e":"È prodotto e immagazzinato dalle cellule endoteliali (corpi di Weibel-Palade) e identifica i vasi in immunoistochimica."}];
const N = DATA.length;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let opts, answers, order, pos, filter = 'all', shuffled = true, showingSummary = false, resetArmed = null;

function init() {
  // Per ogni domanda le opzioni vengono mescolate una volta; l'opzione corretta e' l'indice 0 nei dati.
  opts = DATA.map(q => shuffle(q.o.map((t, i) => ({ t, c: i === 0 }))));
  answers = new Array(N).fill(null);
  buildOrder();
}

function buildOrder() {
  order = DATA.map((_, i) => i).filter(i => filter === 'all' || DATA[i].t === filter);
  if (shuffled) shuffle(order);
  const firstOpen = order.findIndex(i => answers[i] === null);
  pos = firstOpen === -1 ? 0 : firstOpen;
}

function renderTopics() {
  const counts = DATA.reduce((m, q) => (m[q.t] = (m[q.t] || 0) + 1, m), {});
  let h = `<option value="all">Tutti gli apparati (${N})</option>`;
  TOPICS.forEach((name, i) => { h += `<option value="${i}">${esc(name)} (${counts[i] || 0})</option>`; });
  $('topic').innerHTML = h;
  $('sTot').textContent = N;
  $('sTot2').textContent = N;
}

function renderStats() {
  const done = answers.filter(a => a !== null).length;
  const ok = answers.reduce((n, a, i) => n + (a !== null && opts[i][a].c ? 1 : 0), 0);
  $('sAns').textContent = done;
  $('sOk').textContent = ok;
}

function renderMap() {
  $('map').innerHTML = order.map((i, k) => {
    const a = answers[i];
    let cls = 'seg';
    if (a !== null) cls += opts[i][a].c ? ' ok' : ' ko';
    if (k === pos && !showingSummary) cls += ' cur';
    return `<button class="${cls}" data-k="${k}" aria-label="Domanda ${k + 1}"></button>`;
  }).join('');
}

function renderCard() {
  const i = order[pos], q = DATA[i], a = answers[i], done = a !== null;
  let h = `<div class="meta"><span class="topic">${esc(TOPICS[q.t])}</span><span>Domanda ${pos + 1} di ${order.length}</span></div>`;
  h += `<p class="q">${esc(q.q)}</p><div class="opts">`;
  opts[i].forEach((o, k) => {
    let cls = 'opt';
    if (done) { if (o.c) cls += ' ok'; else if (k === a) cls += ' ko'; }
    h += `<button class="${cls}" data-k="${k}" ${done ? 'disabled' : ''}><span class="key">${k + 1}</span><span>${esc(o.t)}</span></button>`;
  });
  h += '</div>';
  if (done) {
    h += opts[i][a].c
      ? '<div class="fb ok" role="status"><b>Corretto.</b></div>'
      : `<div class="fb ko" role="status"><b>Sbagliato.</b>${esc(q.e)}</div>`;
  }
  $('card').innerHTML = h;
}

function renderNav() {
  $('prev').disabled = pos === 0;
  const last = pos === order.length - 1;
  $('next').textContent = last ? 'Vai al riepilogo' : 'Successiva';
  $('shuffle').textContent = shuffled ? 'Ordina per apparato' : 'Mescola le domande';
  $('review').textContent = showingSummary ? 'Torna alle domande' : 'Riepilogo';
}

function renderSummary() {
  const set = order;
  const done = set.filter(i => answers[i] !== null);
  const ok = done.filter(i => opts[i][answers[i]].c);
  const pct = done.length ? Math.round(ok.length / done.length * 100) : 0;
  let h = `<h2>Riepilogo</h2><div class="score">${ok.length} / ${done.length}<small>${pct}% delle risposte date</small></div>`;
  if (done.length < set.length) h += `<p class="empty">${set.length - done.length} domande ancora senza risposta.</p>`;

  const byTopic = {};
  set.forEach(i => {
    const t = DATA[i].t;
    byTopic[t] = byTopic[t] || { tot: 0, done: 0, ok: 0 };
    byTopic[t].tot++;
    if (answers[i] !== null) { byTopic[t].done++; if (opts[i][answers[i]].c) byTopic[t].ok++; }
  });
  Object.keys(byTopic).sort((a, b) => a - b).forEach(t => {
    const r = byTopic[t];
    const w = r.tot ? Math.round(r.ok / r.tot * 100) : 0;
    h += `<div class="trow"><span>${esc(TOPICS[t])}</span><span>${r.ok} / ${r.tot}</span><div class="track"><div class="fill" style="width:${w}%"></div></div></div>`;
  });

  const wrong = done.filter(i => !opts[i][answers[i]].c);
  h += `<h3>Da rivedere (${wrong.length})</h3>`;
  if (!wrong.length) h += '<p class="empty">Nessun errore nelle risposte date.</p>';
  wrong.forEach(i => {
    const q = DATA[i], mine = opts[i][answers[i]].t, right = opts[i].find(o => o.c).t;
    h += `<div class="err"><p class="qq">${esc(q.q)}</p><p class="ko">Tua risposta: ${esc(mine)}</p><p class="ok">Risposta corretta: ${esc(right)}</p><p class="why">${esc(q.e)}</p></div>`;
  });
  $('summary').innerHTML = h;
}

function render() {
  renderStats(); renderMap(); renderNav();
  $('card').classList.toggle('hidden', showingSummary);
  $('nav').classList.toggle('hidden', showingSummary);
  $('summary').classList.toggle('hidden', !showingSummary);
  if (showingSummary) renderSummary(); else renderCard();
}

function goTo(k) { showingSummary = false; pos = Math.max(0, Math.min(order.length - 1, k)); render(); }

function answer(k) {
  const i = order[pos];
  if (answers[i] !== null || k < 0 || k >= opts[i].length) return;
  answers[i] = k;
  render();
}

$('card').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b && !b.disabled) answer(+b.dataset.k); });
$('map').addEventListener('click', e => { const b = e.target.closest('.seg'); if (b) goTo(+b.dataset.k); });
$('prev').addEventListener('click', () => goTo(pos - 1));
$('next').addEventListener('click', () => { if (pos === order.length - 1) { showingSummary = true; render(); } else goTo(pos + 1); });
$('review').addEventListener('click', () => { showingSummary = !showingSummary; render(); });
$('shuffle').addEventListener('click', () => { shuffled = !shuffled; buildOrder(); showingSummary = false; render(); });
$('topic').addEventListener('change', e => { filter = e.target.value === 'all' ? 'all' : +e.target.value; buildOrder(); showingSummary = false; render(); });
$('reset').addEventListener('click', () => {
  if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; $('reset').textContent = 'Ricomincia'; init(); showingSummary = false; render(); return; }
  $('reset').textContent = 'Confermi? Tocca di nuovo';
  resetArmed = setTimeout(() => { resetArmed = null; $('reset').textContent = 'Ricomincia'; }, 4000);
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key >= '1' && e.key <= '4' && !showingSummary) answer(+e.key - 1);
  else if (e.key === 'ArrowRight' && !showingSummary) $('next').click();
  else if (e.key === 'ArrowLeft' && !showingSummary) goTo(pos - 1);
});

init(); renderTopics(); render();
</script>
</body>
</html>
