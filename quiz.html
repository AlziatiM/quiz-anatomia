<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: anatomia funzionale, domande d'esame</title>
<style>
:root{
  --paper:#EDF1EE; --card:#FFFFFF; --ink:#1B2A33; --ink2:#5A6873; --line:#D3DBD6;
  --accent:#1D5F73; --accent-ink:#FFFFFF;
  --ok:#2E7D5B; --ok-bg:#E4F1EA; --ko:#A23B3B; --ko-bg:#F7E6E6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#161C1F; --card:#1F272B; --ink:#E8EDEA; --ink2:#9AA7AE; --line:#34414A;
        --accent:#6FB4C8; --accent-ink:#0F1F26; --ok:#6CC49A; --ok-bg:#1E3A2F; --ko:#E08585; --ko-bg:#432727;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:var(--serif);font-weight:600;font-size:1.65rem;line-height:1.15;margin:0 0 4px;letter-spacing:-0.01em}
.sub{margin:0 0 16px;color:var(--ink2);font-size:.95rem}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.stats{display:flex;gap:14px;font-size:.92rem;color:var(--ink2)}
.stats b{color:var(--ink);font-weight:600}
select{font:inherit;font-size:.92rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
.map{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin:8px 0 18px}
.seg{height:10px;border-radius:2px;background:var(--line);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok)} .seg.ko{background:var(--ko)}
.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 18px 18px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.meta .topic{color:var(--accent);font-weight:600}
.q{font-family:var(--serif);font-size:1.22rem;line-height:1.4;margin:0 0 18px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:1rem;line-height:1.4;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .key{flex:0 0 auto;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1px solid var(--line);font-size:.8rem;display:grid;place-items:center;color:var(--ink2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)} .opt.ko .key{background:var(--ko);border-color:var(--ko);color:#fff}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.95rem;border-left:4px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb b{display:block;margin-bottom:4px}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{font:inherit;font-size:.95rem;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tools .btn{flex:0 0 auto;font-size:.88rem;padding:8px 12px;background:transparent}
.summary{margin-top:6px}
.summary h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 6px}
.score{font-family:var(--serif);font-size:2.2rem;line-height:1;margin:6px 0 14px}
.score small{font-family:var(--sans);font-size:.95rem;color:var(--ink2);margin-left:8px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.trow .track{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.trow .fill{height:100%;background:var(--ok)}
.summary h3{font-size:1rem;margin:22px 0 6px}
.err{border-top:1px solid var(--line);padding:12px 0}
.err .qq{font-family:var(--serif);font-size:1.02rem;margin:0 0 6px}
.err p{margin:3px 0;font-size:.9rem}
.err .ko{color:var(--ko)} .err .ok{color:var(--ok)}
.err .why{color:var(--ink2)}
.empty{color:var(--ink2);font-size:.92rem}
.hidden{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.opt,.seg{transition:background-color .15s,border-color .15s}}
@media (max-width:420px){.wrap{padding:16px 12px 40px} .q{font-size:1.14rem} .map{grid-template-columns:repeat(20,1fr)}}
</style>
</head>

<script>
const TOPICS = ["Cardiocircolatorio", "Respiratorio", "Linfatico", "Genitale femminile", "Genitale maschile", "Urinario", "Digerente", "Denti", "Fegato", "Nervoso", "Orecchio", "Occhio", "Endocrino e tiroide", "Tegumentario, istologia e varie"];
const DATA = [{"t":0,"q":"I periciti si trovano in:","o":["Capillari e venule","Arterie muscolari e arteriole","Vene di medio calibro e valvole","Arterie elastiche e aorta"],"e":"I periciti sono cellule contrattili perivascolari che avvolgono l'endotelio dei capillari e delle venule postcapillari."},{"t":0,"q":"Le cellule muscolari del miocardio specifico sono:","o":["Cellule con citoplasma più abbondante ma più povero di miofibrille rispetto a quelle del miocardio comune","Cellule con citoplasma più scarso ma più ricco di miofibrille rispetto a quelle del miocardio comune","Cellule con citoplasma più abbondante e più ricco di miofibrille rispetto a quelle del miocardio comune","Cellule con citoplasma e miofibrille identici a quelle del miocardio comune, ma prive di dischi intercalari"],"e":"Le cellule del sistema di conduzione sono specializzate nella genesi e conduzione dell'impulso, non nella contrazione: poche miofibrille e citoplasma abbondante, ricco di glicogeno."},{"t":0,"q":"Le arterie elastiche sono così chiamate perché:","o":["La tonaca media è formata da un fitto strato di fibre e lamine elastiche","La tonaca esterna è formata da un fitto strato di fibre e lamine elastiche","La tonaca interna è formata da un fitto strato di fibre e lamine elastiche","La tonaca media è formata da un fitto strato di cellule muscolari lisce"],"e":"Nelle arterie elastiche (aorta, tronco polmonare) la componente elastica prevale nella tonaca media; nelle arterie muscolari prevalgono le cellule muscolari lisce."},{"t":0,"q":"Il cuore è un organo cavo muscolare:","o":["Avvolto dal pericardio e collocato nel mediastino, al centro della gabbia toracica","Avvolto dalla pleura e collocato nel mediastino, al centro della gabbia toracica","Avvolto dal pericardio e collocato nella cavità pleurica sinistra, lateralmente allo sterno","Avvolto dal peritoneo e collocato nel mediastino, dorsalmente alla trachea"],"e":"Il cuore è contenuto nel sacco pericardico e occupa il mediastino medio."},{"t":0,"q":"Il volume ematico è:","o":["6-8% del peso corporeo, 4% nel gatto","10-12% del peso corporeo, 8% nel gatto","6-8% del peso corporeo, 12% nel gatto","2-4% del peso corporeo, 6% nel gatto"],"e":"Il gatto ha un volume ematico relativo più basso rispetto alle altre specie domestiche."},{"t":0,"q":"I canali di comunicazione (canali preferenziali) sono:","o":["Capillari di più ampio lume che bypassano il letto capillare","Venule di più ampio lume che raccolgono il sangue dal letto capillare","Arteriole di più piccolo lume che regolano l'ingresso nel letto capillare","Capillari di più piccolo lume che si ramificano all'interno del letto capillare"],"e":"Collegano direttamente arteriole e venule permettendo al sangue di saltare la rete capillare."},{"t":0,"q":"Nel circolo polmonare (piccolo circolo) il sangue segue in sequenza:","o":["Atrio destro, ventricolo destro, tronco polmonare, arterie polmonari, letto capillare dei polmoni, vene polmonari","Atrio sinistro, ventricolo sinistro, tronco polmonare, arterie polmonari, letto capillare dei polmoni, vene polmonari","Atrio destro, ventricolo destro, vene polmonari, letto capillare dei polmoni, arterie polmonari, tronco polmonare","Atrio destro, ventricolo destro, aorta, arterie polmonari, letto capillare dei polmoni, vene polmonari"],"e":"Il sangue venoso parte dal cuore destro, si ossigena nei capillari polmonari e torna all'atrio sinistro con le vene polmonari."},{"t":0,"q":"Nel circolo sistemico (grande circolo) il sangue segue in sequenza:","o":["Atrio sinistro, ventricolo sinistro, aorta","Atrio destro, ventricolo destro, aorta","Atrio sinistro, ventricolo sinistro, tronco polmonare","Ventricolo sinistro, atrio sinistro, aorta"],"e":"Il sangue ossigenato giunge all'atrio sinistro, passa nel ventricolo sinistro e viene spinto nell'aorta."},{"t":0,"q":"Le fibre di Purkinje si trovano:","o":["Nello strato sottoendocardico","Nello strato sottoepicardico","Nello spessore del miocardio comune","Nel trigono fibroso"],"e":"Le fibre di Purkinje decorrono sotto l'endocardio e da lì distribuiscono l'impulso al miocardio ventricolare."},{"t":0,"q":"La valvola atrioventricolare tricuspide:","o":["Impedisce durante la sistole il reflusso del sangue nell'atrio destro","Impedisce durante la diastole il reflusso del sangue nell'atrio destro","Impedisce durante la sistole il reflusso del sangue nell'atrio sinistro","Impedisce durante la diastole il reflusso del sangue nel ventricolo destro"],"e":"La tricuspide è la valvola atrioventricolare destra: si chiude in sistole ventricolare per evitare il reflusso nell'atrio destro."},{"t":0,"q":"La tonaca interna (intima) dei vasi sanguigni è costituita da:","o":["Endotelio, strato sottoendoteliale e membrana elastica interna","Endotelio, strato sottoendoteliale e membrana elastica esterna","Endotelio, cellule muscolari lisce e membrana elastica interna","Mesotelio, strato sottoendoteliale e lamine elastiche"],"e":"La membrana elastica esterna separa invece la tonaca media dalla tonaca avventizia."},{"t":0,"q":"La vena porta:","o":["Raccoglie il sangue venoso proveniente dall'intestino per irrorare il fegato","Raccoglie il sangue venoso proveniente dal fegato per riportarlo al cuore","Raccoglie il sangue arterioso proveniente dall'aorta per irrorare il fegato","Raccoglie il sangue venoso proveniente dai reni per irrorare l'intestino"],"e":"Il sangue refluo dal tubo digerente, ricco di nutrienti, passa nel fegato prima di raggiungere la circolazione generale."},{"t":0,"q":"I vasa vasorum si trovano principalmente:","o":["Nella tonaca esterna (avventizia)","Nella tonaca media","Nella tonaca interna (intima)","Nella membrana elastica interna"],"e":"I vasa vasorum nutrono la parete dei grossi vasi e decorrono nell'avventizia; l'intima è nutrita per diffusione dal lume."},{"t":0,"q":"Il pacemaker naturale del cuore è:","o":["Il nodo senoatriale","Il nodo atrioventricolare","Il fascio di His","Le fibre di Purkinje"],"e":"Il nodo senoatriale ha la frequenza di scarica spontanea più alta e impone il ritmo a tutto il cuore."},{"t":0,"q":"La funzione del nodo atrioventricolare è:","o":["Ritardare la propagazione dell'impulso","Generare l'impulso cardiaco","Accelerare la propagazione dell'impulso","Bloccare la propagazione dell'impulso"],"e":"Il ritardo nel nodo atrioventricolare permette agli atri di completare la contrazione prima che inizi quella ventricolare."},{"t":0,"q":"In quale struttura dell'apparato circolatorio vi è la maggiore percentuale di sangue?","o":["Vene","Arterie","Capillari","Cuore"],"e":"Le vene sono vasi di capacitanza e contengono la maggior parte del volume ematico."},{"t":0,"q":"I capillari sono vasi di dimensione:","o":["5-10 µm","50-100 µm","0,5-1 µm","100-200 µm"],"e":"Il lume dei capillari è paragonabile al diametro di un eritrocita, che li attraversa in fila singola."},{"t":0,"q":"L'aorta è:","o":["Un'arteria elastica di conduzione di grosso calibro","Un'arteria muscolare di distribuzione di grosso calibro","Un'arteria elastica di resistenza di medio calibro","Un'arteria muscolare di conduzione di medio calibro"],"e":"Le arterie di conduzione (elastiche) portano il sangue dal cuore ai distretti; le arterie muscolari lo distribuiscono agli organi."},{"t":0,"q":"Non è riconducibile al tessuto muscolare:","o":["L'endocardio","Il miocardio comune","Il miocardio specifico","Le fibre di Purkinje"],"e":"L'endocardio è un rivestimento endoteliale con connettivo sottostante; miocardio comune, specifico e fibre di Purkinje sono cellule muscolari."},{"t":0,"q":"Il trigono fibroso è:","o":["Connettivo denso posto tra i due osti atrioventricolari e la base dell'aorta","Connettivo lasso posto tra i due osti atrioventricolari e la base del tronco polmonare","Tessuto muscolare specifico posto tra i due atri e la base dell'aorta","Connettivo denso posto tra i due ventricoli e la base del tronco polmonare"],"e":"Fa parte dello scheletro fibroso del cuore, che sostiene le valvole e isola elettricamente atri e ventricoli."},{"t":0,"q":"Segna l'affermazione errata:","o":["La parete del ventricolo destro è più spessa di quella del ventricolo sinistro","La parete del ventricolo sinistro è più spessa di quella del ventricolo destro","La parete degli atri è più sottile di quella dei ventricoli","Il ventricolo sinistro pompa il sangue nel circolo sistemico"],"e":"Il ventricolo sinistro, che deve vincere la resistenza del circolo sistemico, ha la parete più spessa."},{"t":0,"q":"Il liquido pericardico tra pericardio viscerale (epicardio) e pericardio parietale è normalmente di:","o":["20-50 ml","2-5 ml","200-500 ml","100-150 ml"],"e":"Una sottile lamina di liquido lubrifica le due sierose pericardiche durante il ciclo cardiaco."},{"t":0,"q":"I barocettori sono:","o":["Meccanocettori neurosensoriali posti nei vasi sanguigni e nel cuore che rispondono a variazioni di pressione del sistema cardiovascolare","Chemocettori neurosensoriali posti nei vasi sanguigni e nel cuore che rispondono a variazioni di ossigeno del sangue","Meccanocettori neurosensoriali posti nella parete toracica che rispondono a variazioni di volume dei polmoni","Termocettori neurosensoriali posti nei vasi sanguigni che rispondono a variazioni di temperatura del sangue"],"e":"I barocettori (seno carotideo, arco aortico, cuore) rilevano lo stiramento della parete e regolano per via riflessa pressione e frequenza."},{"t":0,"q":"La milza svolge la funzione di deposito di sangue principalmente nel:","o":["Cavallo","Cane","Bovino","Gatto"],"e":"La milza equina è voluminosa e ricca di muscolatura liscia: durante lo sforzo immette in circolo il sangue immagazzinato."},{"t":1,"q":"Le cellule dell'epitelio olfattivo stimolate dalle sostanze odorose sono:","o":["Neuroni bipolari primari con i dendriti esposti all'aria nella cavità nasale","Cellule epiteliali di sostegno con i microvilli esposti all'aria nella cavità nasale","Neuroni multipolari secondari con gli assoni esposti all'aria nella cavità nasale","Cellule basali indifferenziate con le ciglia esposte all'aria nella cavità nasale"],"e":"Le cellule olfattive sono neuroni sensoriali primari: il dendrite porta i peli olfattivi in superficie, l'assone raggiunge il bulbo olfattivo."},{"t":1,"q":"La reazione di Flehmen è attribuita:","o":["All'organo vomeronasale","Alla mucosa olfattiva del meato dorsale","Alla ghiandola nasale laterale","Al diverticolo nasale"],"e":"Il sollevamento del labbro superiore facilita il trasporto di sostanze chimiche poco volatili (feromoni) all'organo vomeronasale."},{"t":1,"q":"Segna l'affermazione errata riguardo allo stimolo olfattivo che prosegue lungo il tratto (stria) mediale verso il setto pellucido:","o":["Conduce l'informazione al lobo piriforme","Fa parte della via olfattiva che origina dal bulbo olfattivo","Raggiunge l'area settale del telencefalo","È distinto dal tratto laterale, che conduce al lobo piriforme"],"e":"È la stria olfattoria laterale a raggiungere il lobo piriforme; la stria mediale si dirige all'area settale."},{"t":1,"q":"L'organo vomeronasale nel cavallo è formato da:","o":["Una struttura tubulare duplice posizionata alla base delle cavità nasali, ai lati del setto nasale","Una struttura tubulare singola posizionata sul pavimento della cavità orale, in corrispondenza della papilla incisiva","Una struttura sacculare duplice posizionata nel meato dorsale, ai lati della lamina cribrosa","Una struttura tubulare duplice posizionata nel vestibolo nasale, ai lati del diverticolo"],"e":"L'organo è pari: due dotti sostenuti da cartilagine alla base della cavità nasale, lungo il setto; nel cavallo mancano i dotti incisivi."},{"t":1,"q":"I seni paranasali sono delimitati e sostenuti:","o":["In parte da cartilagine, in parte da mucosa","In parte da osso, in parte da muscolatura striata","Esclusivamente da cartilagine ialina","In parte da tessuto adiposo, in parte da mucosa"],"e":"Risposta della chiave d'esame; i seni sono rivestiti da mucosa respiratoria sottile."},{"t":1,"q":"Il bronco tracheale (trasversale) origina in modo indipendente dalla trachea:","o":["Nei ruminanti e nel suino","Nel cane e nel gatto","Nel cavallo e nell'asino","Nei carnivori e nel cavallo"],"e":"Nei ruminanti e nel suino un bronco per il lobo craniale destro nasce direttamente dalla trachea, prima della biforcazione."},{"t":1,"q":"Segna l'affermazione errata riguardo alle cellule di Clara:","o":["Sono cellule migranti","Sono cellule dell'epitelio bronchiolare","Sono cellule secernenti non ciliate","Hanno funzione di detossificazione"],"e":"Le cellule di Clara sono cellule epiteliali fisse dei bronchioli, non cellule migranti."},{"t":1,"q":"Il meato dorsale separa:","o":["Le conche etmoidali rivestite da mucosa olfattiva","Le conche ventrali rivestite da mucosa respiratoria","Il setto nasale dal palato duro","La conca ventrale dal pavimento della cavità nasale"],"e":"Il meato dorsale (olfattorio) conduce l'aria alla regione olfattiva, tra le conche etmoidali."},{"t":1,"q":"Sono diffusi sulla superficie dei setti alveolari:","o":["I macrofagi alveolari","I mastociti alveolari","I fibroblasti alveolari","Le cellule di Clara"],"e":"I macrofagi alveolari pattugliano la superficie degli alveoli fagocitando particelle e microrganismi."},{"t":1,"q":"Il muscolo tracheale liscio è posizionato all'esterno della tonaca fibrocartilaginea:","o":["Nel cane e nel gatto","Nel cavallo e nel bovino","Nel suino e nella pecora","Nel bovino e nella capra"],"e":"Nei carnivori il muscolo tracheale si inserisce sulla faccia esterna degli anelli; nelle altre specie all'interno."},{"t":1,"q":"Segna l'affermazione errata riguardo alla pleura parietale:","o":["Riveste direttamente la superficie esterna del polmone","Riveste la superficie interna della parete toracica","Riveste la faccia toracica del diaframma","Riveste le pareti del mediastino"],"e":"La superficie del polmone è rivestita dalla pleura viscerale (polmonare), non dalla parietale."},{"t":1,"q":"Il surfattante polmonare è prodotto da:","o":["Cellule epiteliali alveolari di tipo II","Cellule epiteliali alveolari di tipo I","Macrofagi alveolari","Cellule endoteliali dei capillari alveolari"],"e":"I pneumociti di tipo II secernono il surfattante, che riduce la tensione superficiale alveolare."},{"t":1,"q":"Le cavità nasali del cavallo hanno un volume minore rispetto alla faccia:","o":["A causa dei seni paranasali e della parte infissa di premolari e molari","A causa delle conche nasali e della parte infissa degli incisivi e dei canini","A causa del diverticolo nasale e dello spessore delle ossa nasali","A causa della tasca gutturale e della parte infissa dei premolari"],"e":"Gran parte del volume della faccia equina è occupata dai seni paranasali e dalle lunghe radici dei denti giugali."},{"t":1,"q":"Il muscolo cricoaritenoideo laterale è:","o":["Adduttore delle corde vocali: costringe la rima della glottide","Abduttore delle corde vocali: dilata la rima della glottide","Tensore delle corde vocali: allunga i legamenti vocali","Elevatore della laringe: la avvicina alla faringe"],"e":"Il cricoaritenoideo laterale ruota le aritenoidi avvicinando le corde vocali; l'abduttore è il cricoaritenoideo dorsale."},{"t":1,"q":"Segna l'affermazione errata riguardo a ciò che è presente nella laringe:","o":["Ghiandole sieromucose","Cartilagini ialine (tiroide, cricoide)","Cartilagine elastica (epiglottide)","Muscoli striati intrinseci"],"e":"Risposta della chiave d'esame."},{"t":1,"q":"L'elemento strutturale del polmone dove avviene lo scambio gassoso è:","o":["L'alveolo aerifero","Il bronchiolo terminale","Il bronchiolo respiratorio","Il dotto alveolare"],"e":"Solo a livello degli alveoli la barriera aria-sangue è abbastanza sottile da consentire la diffusione dei gas."},{"t":1,"q":"I muscoli intrinseci della laringe sono adibiti a:","o":["Regolare il flusso dell'aria attraverso la rima della glottide","Sollevare e abbassare la laringe durante la deglutizione","Sostenere la cartilagine epiglottide durante la respirazione","Muovere l'osso ioide durante la fonazione"],"e":"I muscoli intrinseci muovono le cartilagini laringee tra loro, aprendo e chiudendo la glottide; quelli estrinseci spostano l'intera laringe."},{"t":1,"q":"I muscoli cricoaritenoidei dorsali (posteriori):","o":["Abducono le corde vocali, dilatando la rima della glottide","Adducono le corde vocali, costringendo la rima della glottide","Tendono le corde vocali, allungando i legamenti vocali","Rilasciano le corde vocali, accorciando i legamenti vocali"],"e":"È l'unico muscolo dilatatore della glottide: la sua paralisi causa l'emiplegia laringea del cavallo."},{"t":1,"q":"La propria-sottomucosa della regione respiratoria delle cavità nasali è detta:","o":["Strato cavernoso","Strato papillare","Strato reticolare","Strato lamellare"],"e":"È ricchissima di vene a parete sottile (vasi capacitanti) che regolano la congestione della mucosa."},{"t":1,"q":"Fanno parte delle vie aerifere superiori:","o":["Narici, cavità nasali, faringe","Narici, cavità nasali, laringe","Cavità nasali, laringe, trachea","Faringe, laringe, trachea"],"e":"Secondo la chiave d'esame le vie superiori comprendono narici, cavità nasali e faringe."},{"t":1,"q":"La temperatura dell'aria inspirata viene innalzata nelle cavità nasali grazie a:","o":["Il ricco plesso di venule a parete sottile presente nella lamina propria","Il ricco plesso di arteriole a parete spessa presente nella sottomucosa","Le numerose ghiandole sierose presenti nella lamina propria","Il fitto strato di fibre elastiche presente nella tonaca propria"],"e":"Il sangue del plesso venoso cede calore all'aria inspirata."},{"t":1,"q":"Nell'inspirazione:","o":["Il diaframma e i muscoli intercostali esterni si contraggono; la pressione alveolare e pleurica diminuiscono","Il diaframma e i muscoli intercostali interni si contraggono; la pressione alveolare e pleurica aumentano","Il diaframma si rilascia e i muscoli intercostali esterni si contraggono; la pressione alveolare diminuisce","Il diaframma e i muscoli intercostali esterni si rilasciano; la pressione alveolare e pleurica diminuiscono"],"e":"L'aumento di volume della gabbia toracica riduce la pressione pleurica e alveolare, richiamando aria nei polmoni."},{"t":1,"q":"Le cellule caliciformi dell'epitelio respiratorio delle cavità nasali:","o":["Sono cellule secernenti mucipare che producono glicoproteine acide","Sono cellule secernenti sierose che producono glicoproteine neutre","Sono cellule ciliate che trasportano il muco verso la faringe","Sono cellule sensoriali che producono proteine leganti gli odori"],"e":"Le caliciformi producono la componente mucosa acida; le cellule sierose producono glicoproteine neutre."},{"t":1,"q":"L'epitelio dei bronchioli terminali è:","o":["Cubico semplice","Cilindrico pseudostratificato ciliato","Pavimentoso semplice","Cubico stratificato"],"e":"Procedendo distalmente l'epitelio respiratorio si abbassa fino a diventare cubico semplice nei bronchioli terminali."},{"t":1,"q":"Il polmone è costituito per il 6% da:","o":["Vie aerifere intrapolmonari (bronchi e bronchioli)","Alveoli e setti interalveolari","Vasi sanguigni e linfatici","Connettivo interstiziale e pleura"],"e":"La quasi totalità del volume polmonare è occupata dal parenchima respiratorio; le vie di conduzione ne rappresentano una piccola frazione."},{"t":1,"q":"Per epitelio respiratorio si intende:","o":["Epitelio batiprismatico pseudostratificato con microvilli, ciglia e cellule caliciformi","Epitelio batiprismatico semplice con microvilli, privo di ciglia e di cellule caliciformi","Epitelio pavimentoso stratificato con ciglia e cellule caliciformi","Epitelio cubico pseudostratificato con microvilli e cellule sierose"],"e":"È l'epitelio che riveste le vie aerifere dalla cavità nasale ai bronchi: ciliato, pseudostratificato e ricco di cellule mucipare."},{"t":1,"q":"In quale specie le cartilagini nasali sono incomplete, tanto da rendere la narice particolarmente mobile?","o":["Cavallo","Cane","Bovino","Suino"],"e":"Nel cavallo l'ala della narice è sostenuta in gran parte da tessuto molle: le narici possono dilatarsi molto durante lo sforzo."},{"t":1,"q":"Il muscolo tiroaritenoideo:","o":["Regola la tensione delle corde vocali","Determina l'abduzione delle corde vocali","Determina la costrizione dell'aditus laringeo","Determina l'elevazione dell'epiglottide"],"e":"Risposta della chiave d'esame: il tiroaritenoideo agisce sulla tensione delle corde vocali."},{"t":1,"q":"Il muscolo aritenoideo trasverso:","o":["Determina la costrizione della glottide","Determina la dilatazione della glottide","Determina la tensione dei legamenti vocali","Determina l'abbassamento dell'epiglottide"],"e":"Avvicina tra loro le cartilagini aritenoidi, chiudendo la porzione dorsale della rima della glottide."},{"t":1,"q":"Le corde vocali:","o":["Si inseriscono sulla cartilagine tiroide ventralmente e sulle cartilagini aritenoidi","Si inseriscono sulla cartilagine cricoide ventralmente e sulle cartilagini aritenoidi","Si inseriscono sulla cartilagine tiroide ventralmente e sulla cartilagine epiglottide","Si inseriscono sull'osso ioide ventralmente e sulla cartilagine cricoide"],"e":"Il legamento vocale va dal processo vocale dell'aritenoide alla faccia interna della cartilagine tiroide."},{"t":1,"q":"Quale di questi organi non presenta un supporto duro e/o flessibile (cartilagineo)?","o":["Bronchioli","Trachea","Bronchi","Laringe"],"e":"Nei bronchioli la cartilagine scompare: la pervietà dipende dalla muscolatura liscia e dal parenchima circostante."},{"t":1,"q":"Nell'epitelio respiratorio, procedendo dai bronchi verso la periferia:","o":["Scompaiono prima (prossimalmente) le ciglia e poi (distalmente) le cellule secernenti","Scompaiono prima (prossimalmente) le cellule secernenti e poi (distalmente) le ciglia","Scompaiono contemporaneamente ciglia e cellule secernenti a livello dei bronchi principali","Persistono sia le ciglia sia le cellule secernenti fino agli alveoli"],"e":"Risposta della chiave d'esame."},{"t":1,"q":"Durante l'inspirazione vengono utilizzati i muscoli:","o":["Intercostali esterni","Intercostali interni","Retti dell'addome","Obliqui dell'addome"],"e":"Gli intercostali esterni sollevano le coste ampliando il torace; gli interni e gli addominali intervengono nell'espirazione forzata."},{"t":2,"q":"Segna l'affermazione errata riguardo alle placche di Peyer:","o":["Sono ghiandole mucipare","Sono aggregati di noduli linfatici della parete intestinale","Fanno parte del tessuto linfatico associato alle mucose (MALT)","Sono particolarmente sviluppate nell'ileo"],"e":"Le placche di Peyer sono tessuto linfatico, non ghiandole."},{"t":2,"q":"Il chilifero è:","o":["Il vaso linfatico centrale del villo intestinale","Il vaso sanguigno centrale del villo intestinale","Il dotto linfatico principale del mesentere","Il capillare arterioso della cripta intestinale"],"e":"Il chilifero raccoglie i lipidi assorbiti (chilomicroni) e li porta nella linfa."},{"t":2,"q":"Dove avviene l'ematopoiesi nell'animale adulto?","o":["Nel midollo osseo rosso","Nel midollo osseo giallo","Nella milza","Nel fegato"],"e":"Fegato e milza sono sedi ematopoietiche fetali; nell'adulto la funzione è del midollo osseo rosso."},{"t":2,"q":"Dove nascono i linfociti indifferenziati?","o":["Nel midollo osseo","Nel timo","Nei linfonodi","Nella milza"],"e":"Tutti i linfociti originano dalle cellule staminali del midollo osseo; i precursori T maturano poi nel timo."},{"t":2,"q":"Organi che producono e secernono anticorpi:","o":["Milza e timo (e borsa di Fabrizio negli uccelli)","Fegato e rene (e sacco vitellino negli uccelli)","Midollo osseo giallo e pancreas (e cloaca negli uccelli)","Cuore e polmone (e sacchi aerei negli uccelli)"],"e":"Risposta della chiave d'esame."},{"t":2,"q":"Le guaine linfatiche periarteriose (PALS):","o":["Sono situate nella polpa bianca della milza e contengono linfociti B, T, macrofagi e cellule dendritiche","Sono situate nella polpa rossa della milza e contengono eritrociti, piastrine e macrofagi","Sono situate nella corticale dei linfonodi e contengono esclusivamente linfociti B","Sono situate nella midollare del timo e contengono linfoblasti e cellule epiteliali reticolari"],"e":"Le PALS avvolgono le arterie centrali della polpa bianca e sono la zona T-dipendente della milza."},{"t":2,"q":"Il tessuto linfatico diffuso è abbondante:","o":["Nell'ileo","Nel duodeno","Nell'esofago","Nello stomaco"],"e":"L'ileo è la porzione intestinale più ricca di tessuto linfatico, diffuso e aggregato in placche di Peyer."},{"t":2,"q":"Quale struttura non è formata da stroma di fibre reticolari?","o":["Timo","Linfonodo","Milza","Midollo osseo"],"e":"Lo stroma del timo è epiteliale (cellule epiteliali reticolari), non connettivale."},{"t":2,"q":"Dove si trovano i capillari (sinusoidi) nella milza?","o":["Nella polpa rossa","Nella polpa bianca","Nella capsula","Nelle PALS"],"e":"La polpa rossa è formata da seni venosi e cordoni splenici, sede della filtrazione del sangue."},{"t":2,"q":"I noduli linfatici dei linfonodi si presentano nella midollare esclusivamente nel:","o":["Suino","Cane","Cavallo","Bovino"],"e":"Il linfonodo del suino ha struttura invertita: i noduli sono al centro e la linfa entra dall'ilo."},{"t":2,"q":"Il midollo osseo rosso è:","o":["Situato tra le trabecole del tessuto osseo spugnoso dell'epifisi delle ossa lunghe","Situato nel canale midollare della diafisi delle ossa lunghe","Situato nello spessore del tessuto osseo compatto della diafisi","Situato tra le lamelle del periostio delle ossa piatte"],"e":"Nell'adulto il canale diafisario contiene midollo giallo (adiposo); il midollo rosso persiste nell'osso spugnoso."},{"t":2,"q":"I noduli (follicoli) linfatici della milza si trovano:","o":["Nella polpa bianca splenica","Nella polpa rossa splenica","Nella capsula splenica","Nei seni venosi splenici"],"e":"I noduli linfatici (zona B-dipendente) fanno parte della polpa bianca insieme alle PALS."},{"t":2,"q":"La corticale del timo è:","o":["Suddivisa dalle cellule epiteliali reticolari stellate in microcompartimenti ricchi di linfoblasti","Suddivisa da trabecole connettivali in noduli con centri germinativi ricchi di linfociti B","Suddivisa da fibre reticolari in cordoni ricchi di plasmacellule","Suddivisa dai corpuscoli di Hassall in lobuli poveri di linfociti"],"e":"Nella corticale timica i timociti in proliferazione sono sostenuti da una rete di cellule epiteliali; i corpuscoli di Hassall sono nella midollare."},{"t":2,"q":"I linfonodi:","o":["Svolgono la funzione di filtrazione della linfa","Svolgono la funzione di filtrazione del sangue","Svolgono la funzione di maturazione dei linfociti T","Svolgono la funzione di produzione degli eritrociti"],"e":"La linfa attraversa i seni del linfonodo, dove antigeni e particelle vengono trattenuti e presentati ai linfociti."},{"t":2,"q":"Gran parte dei linfociti T abbandonano il timo:","o":["Tramite il circolo sanguigno venoso","Tramite i vasi linfatici efferenti","Tramite il circolo sanguigno arterioso","Tramite il dotto toracico"],"e":"I timociti maturi passano nelle venule postcapillari della giunzione cortico-midollare ed entrano in circolo."},{"t":2,"q":"L'involuzione del timo è dovuta:","o":["All'aumento dei livelli di ormoni sessuali circolanti","Alla diminuzione dei livelli di ormoni tiroidei circolanti","All'aumento dei livelli di ormone della crescita circolante","Alla diminuzione dei livelli di cortisolo circolante"],"e":"Con la pubertà gli ormoni sessuali inducono la regressione del parenchima timico, sostituito da tessuto adiposo."},{"t":2,"q":"I noduli linfatici primari, in risposta al riconoscimento di un antigene:","o":["Evolvono in centri germinativi con spiccata attività linfoblastica","Regrediscono in tessuto linfatico diffuso privo di attività proliferativa","Si trasformano in cordoni midollari ricchi di plasmacellule quiescenti","Si fondono in placche con attività esclusivamente macrofagica"],"e":"Il nodulo primario diventa secondario: al centro compare il centro germinativo dove i linfociti B proliferano."},{"t":2,"q":"Il compartimento emopoietico del midollo osseo:","o":["Si compone di cordoni irregolari situati tra i seni venosi","Si compone di noduli regolari situati intorno alle arteriole","Si compone di lamelle concentriche situate intorno ai canali di Havers","Si compone di follicoli situati tra le trabecole ossee"],"e":"Le cellule emopoietiche formano cordoni tra i sinusoidi venosi, nei quali passano le cellule mature."},{"t":3,"q":"Segna l'affermazione errata riguardo alla mucosa dell'ovidotto (tuba uterina):","o":["Presenta cellule della granulosa","Presenta cellule ciliate","Presenta cellule secernenti","Presenta pieghe longitudinali ramificate"],"e":"Le cellule della granulosa appartengono al follicolo ovarico, non alla tuba."},{"t":3,"q":"Le cellule stromali specializzate del follicolo sono:","o":["Cellule della teca","Cellule della granulosa","Cellule luteiniche","Cellule germinali primordiali"],"e":"La teca deriva dallo stroma ovarico; la granulosa è di natura epiteliale."},{"t":3,"q":"Per follicoli di Graaf si intende:","o":["Follicoli terziari all'avvicinarsi dell'ovulazione","Follicoli primari all'inizio della crescita","Follicoli secondari alla comparsa dell'antro","Follicoli atresici in fase di regressione"],"e":"Il follicolo di Graaf è il follicolo maturo, preovulatorio, con antro ampio e cumulo ooforo."},{"t":3,"q":"In quale specie la corticale dell'ovaio è superficiale soltanto a livello della fossa di ovulazione?","o":["Equino","Bovino","Suino","Canino"],"e":"Nella cavalla midollare e corticale sono invertite: la corticale affiora solo nella fossa di ovulazione, unico punto in cui può avvenire l'ovulazione."},{"t":3,"q":"Nello strato più esterno della corticale ovarica sono situati:","o":["Follicoli primordiali","Follicoli terziari","Corpi lutei","Cellule della teca"],"e":"I follicoli primordiali, piccolissimi, occupano la porzione più superficiale della corticale, subito sotto l'epitelio germinativo."},{"t":3,"q":"Le caruncole sono:","o":["Siti di ancoraggio della placenta","Siti di produzione del progesterone","Siti di impianto dei follicoli","Siti di secrezione del latte uterino"],"e":"Nei ruminanti i cotiledoni fetali si connettono alle caruncole uterine formando i placentomi."},{"t":3,"q":"Le caruncole sono presenti nell'utero della:","o":["Pecora","Cagna","Cavalla","Scrofa"],"e":"Le caruncole sono tipiche dei ruminanti (pecora, capra, vacca)."},{"t":3,"q":"La ghiandola mammaria è una ghiandola:","o":["Tubulo-alveolare composta, a secrezione apocrina","Tubulare semplice, a secrezione merocrina","Alveolare semplice, a secrezione olocrina","Tubulo-acinosa composta, a secrezione olocrina"],"e":"La componente lipidica del latte viene rilasciata per via apocrina, con parte della membrana apicale."},{"t":3,"q":"L'unità fondamentale della ghiandola mammaria è:","o":["Il lobulo","Il lobo","L'alveolo","Il dotto galattoforo"],"e":"Il lobulo raggruppa gli alveoli tributari di un dotto intralobulare; più lobuli formano un lobo."},{"t":3,"q":"Le cellule luteiniche producono principalmente:","o":["Progesterone","Estrogeni","Ossitocina","Prolattina"],"e":"Il corpo luteo è la principale fonte di progesterone, necessario al mantenimento della gravidanza."},{"t":3,"q":"I capillari del follicolo sono situati nella:","o":["Teca interna","Teca esterna","Granulosa","Zona pellucida"],"e":"La granulosa è avascolare: i nutrienti arrivano per diffusione dai capillari della teca interna."},{"t":3,"q":"Gli oociti primari rimangono fino a dopo la pubertà:","o":["In profase della prima divisione meiotica","In metafase della prima divisione meiotica","In profase della seconda divisione meiotica","In metafase della seconda divisione meiotica"],"e":"La meiosi inizia nella vita fetale e si arresta in profase I (diplotene) fino al picco preovulatorio di LH."},{"t":3,"q":"L'oocita ovulato maturo è fermo in:","o":["Metafase della seconda divisione meiotica","Profase della prima divisione meiotica","Metafase della prima divisione meiotica","Anafase della seconda divisione meiotica"],"e":"Dopo l'ovulazione l'oocita secondario resta in metafase II fino alla fecondazione."},{"t":3,"q":"La seconda divisione meiotica dell'oocita termina con:","o":["La fecondazione","L'ovulazione","La pubertà","La formazione dell'antro"],"e":"Solo l'ingresso dello spermatozoo completa la meiosi II con l'espulsione del secondo globulo polare."},{"t":3,"q":"Cosa si intende con l'acronimo PGC?","o":["Cellule germinali primordiali","Cellule della granulosa primarie","Cellule progenitrici del corpo luteo","Cellule perifollicolari della corticale"],"e":"Le PGC (primordial germ cells) migrano dal sacco vitellino alle creste genitali durante l'embriogenesi."},{"t":3,"q":"In quale parte della tuba uterina avviene la fecondazione?","o":["Ampolla","Istmo","Infundibolo","Giunzione utero-tubarica"],"e":"L'ampolla è il tratto dilatato della tuba dove oocita e spermatozoi si incontrano."},{"t":3,"q":"Lo sviluppo del corpo luteo e l'inizio della secrezione di progesterone si hanno in:","o":["Metaestro","Proestro","Estro","Anestro"],"e":"Il metaestro segue l'ovulazione: le cellule del follicolo si luteinizzano e inizia la fase luteinica."},{"t":3,"q":"Le cellule epiteliali specializzate del follicolo sono:","o":["Cellule della granulosa","Cellule della teca interna","Cellule della teca esterna","Cellule luteiniche"],"e":"La granulosa deriva dalle cellule follicolari epiteliali che circondano l'oocita."},{"t":3,"q":"Il corpo luteo dopo la regressione luteinica è detto:","o":["Corpo albicante","Corpo emorragico","Corpo rubro","Corpo atresico"],"e":"La regressione lascia una cicatrice connettivale biancastra, il corpo albicante."},{"t":3,"q":"La grandezza dei follicoli primordiali è di circa:","o":["40 µm","400 µm","4 µm","4 mm"],"e":"Il follicolo primordiale è formato dall'oocita circondato da un unico strato di cellule follicolari appiattite."},{"t":3,"q":"Segna l'affermazione errata riguardo alle principali differenze tra gli uteri delle diverse specie:","o":["Differiscono per la struttura della parete uterina","Differiscono per forma e lunghezza delle corna uterine","Differiscono per l'estensione del corpo dell'utero","Differiscono per la conformazione della cervice"],"e":"La struttura a tre tonache della parete uterina è comune a tutte le specie; variano forma e proporzioni di corna, corpo e cervice."},{"t":3,"q":"Ogni divisione meiotica nell'oocita produce:","o":["Una cellula grande (oocita) e un piccolo globulo polare","Due oociti di uguali dimensioni","Quattro cellule aploidi di uguali dimensioni","Un oocita e due globuli polari di uguali dimensioni"],"e":"La divisione è asimmetrica: il citoplasma resta nell'oocita e il globulo polare riceve solo il corredo cromosomico."},{"t":3,"q":"In una bovina (ciclo estrale di 21 giorni) il massimo sviluppo del corpo luteo si ha:","o":["Dopo 12 giorni dall'estro","Dopo 3 giorni dall'estro","Dopo 18 giorni dall'estro","Dopo 21 giorni dall'estro"],"e":"Il corpo luteo raggiunge il massimo volume e la massima produzione di progesterone a metà ciclo."},{"t":3,"q":"L'epitelio della mucosa delle tube uterine è formato da:","o":["Cellule ciliate e cellule secernenti","Cellule ciliate e cellule della granulosa","Cellule secernenti e cellule luteiniche","Cellule pavimentose e cellule caliciformi"],"e":"Le ciliate trasportano l'oocita, le secernenti producono il fluido tubarico che nutre gameti ed embrione."},{"t":3,"q":"Nella mucosa delle corna uterine di tutti i mammiferi erbivori:","o":["Si rinvengono ghiandole uterine a carico della tonaca propria dell'endometrio","Si rinvengono ghiandole uterine a carico della tonaca muscolare del miometrio","Non si rinvengono ghiandole, ma solo cellule caliciformi dell'epitelio","Si rinvengono ghiandole uterine a carico della sierosa del perimetrio"],"e":"Le ghiandole uterine sono ghiandole tubulari dell'endometrio che secernono il latte uterino."},{"t":3,"q":"Il corpo luteo è una conseguenza dell'evoluzione maturativa:","o":["Del follicolo maturo, dopo l'ovulazione","Del follicolo primordiale","Del follicolo atresico","Della teca esterna"],"e":"Dopo l'ovulazione granulosa e teca interna del follicolo si trasformano in cellule luteiniche."},{"t":3,"q":"Da dove arrivano i metaboliti all'oocita?","o":["Da gap junction situate nelle estensioni citoplasmatiche tra oocita e cellule della granulosa circostanti","Da desmosomi situati tra oocita e cellule della teca interna","Da capillari che penetrano direttamente la zona pellucida","Dal liquido follicolare attraverso pori della membrana basale"],"e":"I prolungamenti delle cellule della granulosa attraversano la zona pellucida e comunicano con l'oocita tramite gap junction."},{"t":3,"q":"I metaboliti per la crescita dell'oocita all'interno del follicolo derivano direttamente:","o":["Dalla rete capillare della teca interna","Dalla rete capillare della granulosa","Dai vasi della zona pellucida","Dai vasi del mesovario"],"e":"La teca interna è l'unico strato vascolarizzato del follicolo."},{"t":3,"q":"L'epitelio della vagina della cagna in proestro/estro è:","o":["Pavimentoso stratificato cheratinizzato","Pavimentoso stratificato non cheratinizzato","Cilindrico semplice con cellule ciliate","Cubico stratificato con cellule mucose"],"e":"Sotto stimolo estrogenico l'epitelio vaginale si ispessisce e cheratinizza: è la base della citologia vaginale nella cagna."},{"t":3,"q":"Quale di queste strutture non è formata da cellule?","o":["Zona pellucida","Granulosa","Teca interna","Corona radiata"],"e":"La zona pellucida è un involucro glicoproteico acellulare che circonda l'oocita."},{"t":3,"q":"I primi fenomeni di atresia/apoptosi dei follicoli ovarici iniziano:","o":["Nel feto, durante la vita uterina","Alla pubertà, con il primo ciclo estrale","Alla nascita, con la separazione dalla madre","Nell'adulto, con il primo corpo luteo"],"e":"La perdita di follicoli comincia già nell'ovaio fetale e prosegue per tutta la vita."},{"t":3,"q":"Al termine di ogni estro, nell'ovaio di scrofa sono presenti:","o":["Da 8 a 15 corpi lutei","Da 1 a 2 corpi lutei","Da 3 a 5 corpi lutei","Da 20 a 30 corpi lutei"],"e":"La scrofa è poliovulatoria: a ogni ciclo ovulano numerosi follicoli, ciascuno dei quali dà un corpo luteo."},{"t":3,"q":"Il maggior numero di follicoli primordiali in una specie si ritrova:","o":["Nell'ovaio di un feto","Nell'ovaio di una femmina alla pubertà","Nell'ovaio di una femmina adulta in estro","Nell'ovaio di una femmina in gravidanza"],"e":"La riserva follicolare è massima nella vita fetale e si riduce progressivamente per atresia."},{"t":3,"q":"Nel follicolo maturo preovulatorio il diametro dell'oocita varia da:","o":["0,15 a 0,3 mm","0,015 a 0,03 mm","1,5 a 3 mm","0,5 a 1 mm"],"e":"L'oocita maturo dei mammiferi domestici misura 150-300 µm, tra le cellule più grandi dell'organismo."},{"t":3,"q":"La zona radiata (pellucida) si trova:","o":["Attorno all'oocita","Attorno al follicolo","Attorno al corpo luteo","Attorno alla teca esterna"],"e":"È l'involucro glicoproteico interposto tra oocita e cellule della granulosa."},{"t":3,"q":"Quale di questi animali è un ovulatore indotto?","o":["Gatta","Cagna","Vacca","Scrofa"],"e":"Nella gatta l'ovulazione è scatenata dallo stimolo coitale; cagna, vacca e scrofa sono ovulatori spontanei."},{"t":3,"q":"Il legamento sospensore (meso) dell'ovaio si chiama:","o":["Mesovario","Mesosalpinge","Mesometrio","Legamento largo"],"e":"Mesovario, mesosalpinge e mesometrio sono le tre porzioni del legamento largo, dedicate rispettivamente a ovaio, tuba e utero."},{"t":3,"q":"Nella mammella il numero di dotti e osti papillari per ciascun capezzolo è:","o":["Particolarmente alto nei carnivori","Particolarmente alto nei ruminanti","Particolarmente alto negli equini","Sempre uno in tutte le specie"],"e":"Nella cagna e nella gatta ogni capezzolo ha numerosi osti; nella vacca uno solo, nella cavalla due."},{"t":4,"q":"Quali tra queste cellule si moltiplicano per mitosi?","o":["Spermatogoni di tipo A","Spermatociti primari","Spermatociti secondari","Spermatidi"],"e":"Gli spermatogoni sono le cellule staminali della linea germinale; dagli spermatociti in poi le divisioni sono meiotiche."},{"t":4,"q":"La testa dello spermatozoo contiene:","o":["L'acrosoma","L'assonema","I mitocondri","Il centriolo distale"],"e":"La testa contiene nucleo e acrosoma; mitocondri e assonema sono nella coda."},{"t":4,"q":"La struttura funzionale della spermatogenesi è costituita da:","o":["Tubuli seminiferi contorti","Tubuli seminiferi retti","Dotti efferenti","Rete testis"],"e":"La spermatogenesi avviene nell'epitelio dei tubuli contorti; tubuli retti e rete testis sono vie di deflusso."},{"t":4,"q":"Segna l'affermazione errata riguardo alla maturazione nucleare durante la spermiogenesi:","o":["Consiste nella terminazione della seconda divisione meiotica","Consiste nella condensazione della cromatina","Consiste nell'allungamento e appiattimento del nucleo","Consiste nella sostituzione degli istoni con protamine"],"e":"La spermiogenesi trasforma lo spermatide, già aploide, in spermatozoo: la meiosi è già conclusa."},{"t":4,"q":"Quali cellule sono adibite alla produzione di testosterone?","o":["Cellule di Leydig","Cellule di Sertoli","Cellule mioidi peritubulari","Spermatogoni"],"e":"Le cellule interstiziali di Leydig producono testosterone sotto stimolo dell'LH."},{"t":4,"q":"Quali tra queste cellule sono aploidi?","o":["Spermatidi arrotondati","Spermatogoni di tipo A","Spermatogoni di tipo B","Spermatociti primari"],"e":"Gli spermatidi derivano dalla seconda divisione meiotica e hanno corredo aploide."},{"t":4,"q":"Quali cellule NON si trovano all'interno dei tubuli seminiferi contorti?","o":["Cellule di Leydig","Cellule di Sertoli","Spermatogoni","Spermatidi"],"e":"Le cellule di Leydig sono nell'interstizio, tra i tubuli."},{"t":4,"q":"Quali cellule formano giunzioni temporanee con le cellule germinali?","o":["Cellule di Sertoli","Cellule di Leydig","Cellule mioidi","Cellule endoteliali"],"e":"Le cellule di Sertoli accompagnano le cellule germinali in maturazione e formano anche la barriera emato-testicolare."},{"t":4,"q":"In caso di castrazione, quali cellule (ipofisarie) sono coinvolte?","o":["Cellule gonadotrope","Cellule tireotrope","Cellule corticotrope","Cellule somatotrope"],"e":"Senza il feedback negativo del testosterone le gonadotrope aumentano la secrezione di LH e FSH."},{"t":4,"q":"Il numero di tubuli seminiferi all'interno di un lobulo (loggia) testicolare è:","o":["Da 1 a 5","Da 10 a 20","Da 50 a 100","Uno soltanto"],"e":"Ogni lobulo, delimitato dai setti dell'albuginea, contiene pochi tubuli contorti molto lunghi."},{"t":4,"q":"In un maschio sessualmente maturo il ciclo di spermatogenesi dura circa:","o":["2 mesi","2 settimane","2 giorni","6 mesi"],"e":"Da spermatogone a spermatozoo occorrono circa 60 giorni nelle specie domestiche."},{"t":4,"q":"Le cellule di Sertoli si trovano:","o":["Tra le cellule germinali, all'interno dei tubuli seminiferi","Tra le cellule interstiziali, all'esterno dei tubuli seminiferi","Nella tonaca albuginea, tra i setti connettivali del testicolo","Nell'epitelio dell'epididimo, tra le cellule principali"],"e":"Poggiano sulla membrana basale del tubulo e si estendono fino al lume, avvolgendo le cellule germinali."},{"t":4,"q":"Da uno spermatocita primario derivano normalmente:","o":["4 spermatozoi","1 spermatozoo","2 spermatozoi","8 spermatozoi"],"e":"Due divisioni meiotiche: uno spermatocita primario dà due secondari e quattro spermatidi."},{"t":4,"q":"L'epitelio della mucosa dell'epididimo e del dotto deferente è:","o":["Batiprismatico pseudostratificato con cellule provviste di microvilli (stereociglia) e secernenti","Cubico semplice con cellule ciliate mobili e cellule caliciformi secernenti muco","Pavimentoso stratificato non cheratinizzato con cellule basali proliferanti e cellule superficiali","Batiprismatico semplice con cellule ciliate mobili e cellule basali di ricambio"],"e":"Le cellule principali con stereociglia riassorbono liquido e secernono fattori per la maturazione degli spermatozoi."},{"t":4,"q":"In quale specie i corpi cavernosi del pene sono formati da piccole lacune sanguigne separate da abbondante tessuto fibroelastico?","o":["Toro","Cane","Cavallo","Gatto"],"e":"Il pene fibroelastico di toro e suino è già rigido a riposo e si allunga per distensione della flessura sigmoidea."},{"t":4,"q":"Il bulbo del glande è particolarmente sviluppato nel pene del:","o":["Cane","Toro","Cavallo","Gatto"],"e":"La dilatazione del bulbo del glande nel cane determina il caratteristico legame durante l'accoppiamento."},{"t":4,"q":"Specie il cui glande del pene può influire sull'ovulazione:","o":["Coniglio e gatto","Cane e cavallo","Toro e ariete","Suino e cane"],"e":"Nel gatto le spicole del glande stimolano la vagina e inducono l'ovulazione; coniglio e gatto sono ovulatori indotti."},{"t":4,"q":"In un maschio con tutte le tipologie di ghiandole che secernono plasma seminale, se ne distinguono per tipologia:","o":["Fino a 4","Fino a 2","Fino a 6","Fino a 8"],"e":"Ampolle dei deferenti, vescichette seminali, prostata e ghiandole bulbouretrali."},{"t":4,"q":"L'epitelio dei tubulo-alveoli delle ghiandole annesse alle vie genitali maschili è:","o":["Cubico o cilindrico, semplice o pluristratificato","Pavimentoso stratificato cheratinizzato","Batiprismatico pseudostratificato ciliato","Pavimentoso semplice"],"e":"L'epitelio ghiandolare varia con l'attività secretoria e lo stato ormonale."},{"t":4,"q":"Lo spessore della tonaca fibrosa (albuginea) che riveste il testicolo è:","o":["Notevolmente maggiore rispetto alla tonaca corrispondente dell'ovaio","Notevolmente minore rispetto alla tonaca corrispondente dell'ovaio","Pressoché uguale a quello della tonaca corrispondente dell'ovaio","Variabile a seconda della stagione riproduttiva"],"e":"L'albuginea testicolare è una spessa capsula di connettivo denso che invia setti nel parenchima."},{"t":4,"q":"Qual è la funzione delle cellule di Sertoli?","o":["Sostegno e nutrimento delle cellule germinali","Produzione di testosterone","Contrazione peritubulare per il trasporto degli spermatozoi","Produzione del liquido seminale"],"e":"Sono le cellule di sostegno dell'epitelio seminifero; il testosterone è prodotto dalle cellule di Leydig."},{"t":4,"q":"Il plesso pampiniforme serve a:","o":["Raffreddare il sangue arterioso diretto al testicolo","Riscaldare il sangue venoso proveniente dal testicolo","Drenare la linfa del testicolo verso i linfonodi inguinali","Aumentare la pressione del sangue arterioso diretto al testicolo"],"e":"Le vene del plesso avvolgono l'arteria testicolare e ne sottraggono calore: la spermatogenesi richiede una temperatura inferiore a quella corporea."},{"t":4,"q":"I corpi cavernosi sono formati da:","o":["Lacune sanguigne separate da tessuto fibroelastico","Lobuli ghiandolari separati da tessuto connettivo","Fasci di muscolatura striata separati da tessuto adiposo","Tubuli seminiferi separati da tessuto interstiziale"],"e":"Il riempimento delle lacune con sangue determina l'erezione."},{"t":4,"q":"Una delle funzioni delle cellule di sostegno (Sertoli) è quella di produrre:","o":["L'ormone anti-Mülleriano (antiparamesonefrico)","Il testosterone","L'ormone follicolo-stimolante","L'ormone luteinizzante"],"e":"Nel feto maschio l'ormone anti-Mülleriano delle cellule di Sertoli fa regredire i dotti paramesonefrici."},{"t":5,"q":"L'ormone antidiuretico (ADH) agisce a livello:","o":["Dei dotti collettori","Del tubulo contorto prossimale","Del glomerulo renale","Dell'ansa del nefrone (segmento sottile)"],"e":"L'ADH aumenta la permeabilità all'acqua dei dotti collettori, concentrando l'urina."},{"t":5,"q":"I reni hanno forma a cuore e sono unilobati nel:","o":["Cavallo","Bovino","Suino","Gatto"],"e":"Il rene destro del cavallo ha la tipica forma a cuore; il rene equino è unipapillare con cresta renale."},{"t":5,"q":"Segna l'affermazione errata riguardo all'apparato iuxtaglomerulare:","o":["È situato nella capsula di Bowman","Comprende la macula densa del tubulo distale","Comprende le cellule iuxtaglomerulari dell'arteriola afferente","È collocato in prossimità del polo vascolare del corpuscolo renale"],"e":"L'apparato iuxtaglomerulare si trova al polo vascolare, dove il tubulo distale contatta le arteriole, non nella capsula di Bowman."},{"t":5,"q":"L'apparato iuxtaglomerulare è un organo recettoriale collocato:","o":["In prossimità del polo vascolare del corpuscolo renale","In prossimità del polo urinifero del corpuscolo renale","Nella parete del dotto collettore midollare","Nella capsula fibrosa del rene"],"e":"Rileva la pressione dell'arteriola afferente e la composizione del filtrato nel tubulo distale, regolando la secrezione di renina."},{"t":5,"q":"Il diverticolo suburetrale si trova ventralmente all'orifizio uretrale esterno:","o":["Nella scrofa e nella vacca","Nella cagna e nella gatta","Nella cavalla e nell'asina","Nella pecora e nella cagna"],"e":"Il diverticolo suburetrale è un'insidia nel cateterismo vescicale di scrofa e vacca."},{"t":5,"q":"Segna l'affermazione errata riguardo alla tonaca muscolare della vescica:","o":["È formata da fasci di cellule muscolari striate","È formata da fasci di cellule muscolari lisce a decorso vario","Costituisce il muscolo detrusore","Si ispessisce a livello del collo formando lo sfintere interno"],"e":"La muscolatura della vescica è liscia; la componente striata appartiene solo allo sfintere uretrale esterno."},{"t":5,"q":"I podociti sono disposti:","o":["Nel foglietto viscerale (interno) della capsula glomerulare","Nel foglietto parietale (esterno) della capsula glomerulare","Nella parete dei capillari glomerulari","Nella macula densa del tubulo distale"],"e":"I podociti avvolgono con i pedicelli i capillari glomerulari e formano il filtro a fenditura."},{"t":5,"q":"Qual è la funzione del sistema controcorrente dei vasa recta?","o":["Mantenere il gradiente osmotico della midollare intrappolando i soluti nel parenchima","Aumentare la filtrazione glomerulare incrementando la pressione nei capillari","Riassorbire il glucosio filtrato nel tubulo prossimale","Secernere renina in risposta alla diminuzione della pressione"],"e":"I vasa recta scambiano acqua e soluti in controcorrente, evitando di dissipare il gradiente creato dall'ansa del nefrone."},{"t":5,"q":"Le principali componenti del labirinto corticale del rene sono:","o":["Corpuscoli renali, tubuli contorti prossimali e distali","Anse del nefrone e dotti collettori","Vasa recta e dotti papillari","Tubuli retti prossimali e distali"],"e":"I raggi midollari contengono invece i tratti retti e i dotti collettori."},{"t":5,"q":"La mucosa della pelvi renale contiene ghiandole mucose nel:","o":["Cavallo","Cane","Bovino","Suino"],"e":"Il muco secreto nella pelvi rende viscosa e torbida l'urina normale del cavallo."},{"t":5,"q":"Il filtrato che passa dal tubulo prossimale retto al segmento sottile (ansa del nefrone) è:","o":["Isosmotico","Ipoosmotico","Iperosmotico","Privo di soluti"],"e":"Nel tubulo prossimale acqua e soluti vengono riassorbiti in proporzione: il filtrato resta isosmotico con il plasma."},{"t":5,"q":"Il muscolo sfintere uretrale esterno è formato da:","o":["Muscolatura striata","Muscolatura liscia","Tessuto fibroelastico","Muscolatura mista liscia e striata"],"e":"Lo sfintere esterno è volontario e striato; quello interno, al collo vescicale, è liscio."},{"t":5,"q":"La maggiore densità di microvilli si trova sulla faccia luminale delle cellule:","o":["Dell'epitelio del tubulo contorto prossimale","Dell'epitelio del tubulo contorto distale","Dell'epitelio del dotto collettore","Del foglietto parietale della capsula di Bowman"],"e":"L'orletto a spazzola del tubulo prossimale riflette l'intensa attività di riassorbimento di questo segmento."},{"t":5,"q":"L'organizzazione in lobi renali è rinvenibile in una sezione dorsale (longitudinale) del rene di:","o":["Maiale","Cavallo","Cane","Gatto"],"e":"Il rene del maiale è liscio esternamente ma multipapillare: i lobi sono riconoscibili in sezione."},{"t":5,"q":"L'ultimo tratto dell'uretere:","o":["Ha una disposizione intramurale, decorrendo nello spessore della parete vescicale","Ha una disposizione extramurale, decorrendo esternamente alla parete vescicale","Sbocca direttamente nell'uretra","Presenta una valvola muscolare striata"],"e":"Il decorso obliquo nella parete vescicale funziona da valvola e impedisce il reflusso dell'urina."},{"t":5,"q":"L'organizzazione della circolazione sanguigna nel glomerulo renale corrisponde a:","o":["Una rete mirabile, cioè un letto capillare compreso tra due arteriole","Un sistema portale, cioè un letto capillare compreso tra due venule","Un'anastomosi arterovenosa, cioè un collegamento diretto tra arteriola e venula","Un plesso venoso, cioè una rete di venule a parete sottile"],"e":"Il glomerulo è interposto tra arteriola afferente ed efferente: questo mantiene alta la pressione di filtrazione."},{"t":5,"q":"I nefroni iuxtamidollari si chiamano così perché:","o":["L'ansa del nefrone (di Henle) si spinge profondamente nella midollare","Il loro glomerulo è situato nella midollare","I loro dotti collettori sboccano nella corticale","Il loro tubulo prossimale è privo di microvilli"],"e":"Hanno il glomerulo al confine cortico-midollare e anse lunghe, essenziali per concentrare l'urina."},{"t":5,"q":"I nefroni corticali si chiamano così perché:","o":["Il loro glomerulo renale è contenuto nella corticale","La loro ansa si spinge profondamente nella midollare","Il loro tubulo distale decorre nella pelvi","Il loro dotto collettore è contenuto nella capsula"],"e":"I nefroni corticali hanno glomerulo superficiale e ansa corta, che penetra poco nella midollare."},{"t":5,"q":"Il glicocalice di podociti e cellule endoteliali ostacola il passaggio di:","o":["Molecole cariche negativamente","Molecole cariche positivamente","Molecole neutre","Molecole di piccole dimensioni indipendentemente dalla carica"],"e":"Il glicocalice è carico negativamente e respinge le molecole anioniche, come l'albumina."},{"t":5,"q":"Fa parte del nefrone:","o":["Il glomerulo renale","Il dotto collettore","Il dotto papillare","La pelvi renale"],"e":"Il nefrone comprende corpuscolo renale e sistema tubulare; i dotti collettori hanno origine embriologica diversa."},{"t":5,"q":"Quale muscolo liscio si trova nella vescica?","o":["Il muscolo detrusore","Il muscolo sfintere uretrale esterno","Il muscolo bulbospongioso","Il muscolo ischiocavernoso"],"e":"Il detrusore è la muscolatura liscia della parete vescicale che si contrae durante la minzione."},{"t":5,"q":"Che tipo di muscolatura si trova nella vescica e nei suoi sfinteri?","o":["Liscia nel detrusore e nello sfintere interno, striata nello sfintere esterno","Liscia nel detrusore e in entrambi gli sfinteri, interno ed esterno","Striata nel detrusore e in entrambi gli sfinteri, interno ed esterno","Striata nel detrusore e nello sfintere interno, liscia nello sfintere esterno"],"e":"La parete e lo sfintere interno sono lisci (involontari); lo sfintere esterno è striato (volontario)."},{"t":5,"q":"Quanti sfinteri presenta la vescica?","o":["Due: uno interno (liscio) e uno esterno (striato)","Uno soltanto, liscio, a livello del collo vescicale","Uno soltanto, striato, a livello dell'uretra pelvica","Tre: due lisci al collo e uno striato nell'uretra"],"e":"Lo sfintere interno è un ispessimento del detrusore al collo; l'esterno è formato dalla muscolatura striata dell'uretra."},{"t":5,"q":"Il rene del gatto è:","o":["Unipapillare","Multipapillare","Plurilobato esternamente","Suddiviso in lobi da solchi profondi"],"e":"Come cane, cavallo e piccoli ruminanti, il gatto ha un rene liscio unipapillare con cresta renale."},{"t":5,"q":"Il nefrone è composto da:","o":["Corpuscolo renale e sistema tubulare","Corpuscolo renale e dotto collettore","Glomerulo e pelvi renale","Sistema tubulare e calici renali"],"e":"Il corpuscolo (glomerulo più capsula) filtra, il sistema tubulare modifica il filtrato."},{"t":5,"q":"I granuli di renina sono contenuti:","o":["Nelle cellule iuxtaglomerulari","Nei podociti","Nelle cellule della macula densa","Nelle cellule del mesangio extraglomerulare"],"e":"Le cellule iuxtaglomerulari sono cellule muscolari lisce modificate dell'arteriola afferente, ricche di granuli di renina."},{"t":5,"q":"In quale specie i reni sono divisi in lobi evidenti esternamente (plurilobati)?","o":["Bovino","Suino","Cavallo","Cane"],"e":"Il rene del bovino è solcato in superficie da profonde fissure che separano i lobi."},{"t":5,"q":"Dove si trova l'epitelio di transizione?","o":["Nelle vie urinarie (pelvi, ureteri, vescica, uretra)","Nei tubuli renali (prossimali, distali e collettori)","Nell'intestino crasso (cieco, colon e retto)","Nelle vie aerifere (trachea, bronchi e bronchioli)"],"e":"L'urotelio cambia altezza con la distensione dell'organo, adattandosi al riempimento."},{"t":6,"q":"Le cellule chemocettrici dei calici gustativi sono situate:","o":["Nelle papille della lingua","Nelle ghiandole salivari","Nella mucosa delle guance","Nelle tonsille palatine"],"e":"I calici gustativi si trovano nell'epitelio delle papille gustative (fungiformi, fogliate, circumvallate)."},{"t":6,"q":"Segna l'affermazione errata riguardo alla ghiandola zigomatica:","o":["È localizzata nella tonaca propria-sottomucosa della lingua","È una ghiandola salivare presente nei carnivori","È situata ventralmente all'orbita","Il suo secreto si versa nel vestibolo della bocca"],"e":"La zigomatica è una ghiandola salivare orbitale dei carnivori, non una ghiandola linguale."},{"t":6,"q":"Quale tra queste non è una ghiandola salivare maggiore?","o":["Palatina","Parotide","Mandibolare","Sottolinguale"],"e":"Le ghiandole palatine sono ghiandole salivari minori, disseminate nella mucosa del palato."},{"t":6,"q":"La mucosa dell'intestino crasso dei carnivori:","o":["È priva di villi intestinali","È ricca di villi intestinali","È priva di cellule caliciformi","È rivestita da epitelio pavimentoso in tutta l'estensione"],"e":"Nel crasso mancano i villi; la superficie è liscia con numerose cripte ricche di cellule caliciformi."},{"t":6,"q":"Le cellule parietali delle ghiandole fundiche producono:","o":["Acido cloridrico (HCl)","Pepsinogeno","Gastrina","Muco"],"e":"Le cellule parietali (delomorfe) secernono HCl e fattore intrinseco; le principali secernono pepsinogeno."},{"t":6,"q":"La sottile membrana sierosa che avvolge la maggior parte degli organi addominali è:","o":["Il peritoneo","La pleura","Il pericardio","La fascia trasversale"],"e":"Il peritoneo viscerale riveste gli organi, quello parietale la cavità addominale."},{"t":6,"q":"La parete dell'esofago presenta epitelio pavimentoso stratificato non cheratinizzato nel:","o":["Cane","Cavallo","Bovino","Suino"],"e":"Nelle specie a dieta grossolana (erbivori, suino) l'epitelio esofageo è cheratinizzato; nel cane no."},{"t":6,"q":"Le papille linguiformi del rumine:","o":["Aumentano di dimensione con la dieta di alimenti grossolani","Diminuiscono di dimensione con la dieta di alimenti grossolani","Sono presenti soltanto nel vitello lattante","Hanno funzione esclusivamente gustativa"],"e":"Le papille ruminali si sviluppano con l'alimentazione fibrosa e aumentano la superficie di assorbimento degli acidi grassi volatili."},{"t":6,"q":"Tra i muscoli masticatori è più sviluppato:","o":["Il temporale nei carnivori; il massetere e gli pterigoidei negli erbivori","Il massetere nei carnivori; il temporale negli erbivori","Il temporale in tutte le specie","Il digastrico nei carnivori; il temporale negli erbivori"],"e":"I carnivori tagliano con movimenti verticali (temporale); gli erbivori triturano con movimenti laterali (massetere e pterigoidei)."},{"t":6,"q":"I calici gustativi della lingua sono innervati da:","o":["Il nervo glossofaringeo (terzo caudale) e la corda del timpano del nervo facciale (due terzi rostrali)","Il nervo ipoglosso (terzo caudale) e il nervo vago (due terzi rostrali)","Il nervo mandibolare del trigemino (terzo caudale) e il nervo ipoglosso (due terzi rostrali)","Il nervo linguale del trigemino (terzo caudale) e il nervo accessorio (due terzi rostrali)"],"e":"La sensibilità gustativa è veicolata da VII (corda del timpano), IX e, per l'epiglottide, X; il trigemino porta la sensibilità generale."},{"t":6,"q":"Quale combinazione di nervi NON è pertinente per l'innervazione sensitiva speciale (gustativa) della lingua?","o":["Nervo mandibolare del trigemino e nervo facciale","Nervo facciale (corda del timpano) e nervo glossofaringeo","Nervo glossofaringeo e nervo vago","Nervo facciale e nervo vago"],"e":"Il nervo mandibolare del trigemino veicola sensibilità generale (tatto, dolore), non gustativa."},{"t":6,"q":"Le papille filiformi e coniche hanno:","o":["Funzione meccanica","Funzione gustativa","Funzione secretoria","Funzione termocettiva"],"e":"Le papille filiformi e coniche sono prive di calici gustativi: servono a trattenere e spostare il cibo."},{"t":6,"q":"Le papille circumvallate, fogliate e fungiformi hanno funzione:","o":["Gustativa","Meccanica","Secretoria","Tattile"],"e":"Sono le papille che portano i calici gustativi."},{"t":6,"q":"Le cellule dell'epitelio dei calici gustativi stimolate dalle sostanze sapide (salate, dolci) sono:","o":["Cellule sensitive (gustative)","Cellule di sostegno","Cellule basali","Cellule caliciformi"],"e":"Il calice gustativo contiene cellule sensitive con microvilli affacciati al poro, cellule di sostegno e cellule basali di ricambio."},{"t":6,"q":"Nell'esofago la tonaca muscolare è striata per tutta la lunghezza:","o":["Nel cane e nei ruminanti","Nel cavallo e nel suino","Nel gatto e nel cavallo","In tutte le specie domestiche"],"e":"In cane e ruminanti la muscolatura esofagea è striata fino allo stomaco; nelle altre specie il tratto caudale è liscio."},{"t":6,"q":"Nel gatto la tonaca muscolare dell'esofago è:","o":["Striata per circa 4/5 della lunghezza, poi mista e infine liscia nel tratto terminale","Liscia per circa 4/5 della lunghezza, poi mista e infine striata nel tratto terminale","Striata per tutta la lunghezza, come nel cane e nei ruminanti","Liscia per tutta la lunghezza, dal faringe fino al cardias"],"e":"Nel gatto la transizione da striata a liscia avviene nel quinto caudale dell'esofago."},{"t":6,"q":"Le ghiandole dell'esofago sono:","o":["Mucose, situate nella sottomucosa","Sierose, situate nella tonaca propria","Miste, situate nella tonaca muscolare","Assenti in tutte le specie"],"e":"Le ghiandole esofagee sottomucose lubrificano il bolo; mucosa e tonaca muscolare consentono ampie variazioni del diametro del lume."},{"t":6,"q":"La doccia (gronda) esofagea è:","o":["Due pieghe della mucosa del reticolo che formano un canale che consente, nei neonati, il passaggio del colostro dall'esofago direttamente all'abomaso","Due pieghe della mucosa del rumine che formano un canale che consente, negli adulti, il passaggio del bolo dal rumine al reticolo","Una piega della mucosa dell'omaso che consente il passaggio del latte dall'omaso al duodeno","Due pieghe della mucosa dell'esofago che consentono, negli adulti, il ritorno del bolo per la ruminazione"],"e":"Il riflesso di chiusura della doccia fa saltare al latte i prestomaci, evitandone la fermentazione."},{"t":6,"q":"Alle ghiandole cardiali e piloriche spetta:","o":["Produrre muco","Produrre acido cloridrico","Produrre pepsinogeno","Produrre lipasi gastrica"],"e":"Cardiali e piloriche sono ghiandole mucose; HCl ed enzimi sono prodotti dalle ghiandole fundiche."},{"t":6,"q":"Le cellule principali delle ghiandole fundiche producono:","o":["Pepsinogeno","Acido cloridrico","Gastrina","Muco"],"e":"Le cellule principali (adelomorfe) secernono pepsinogeno, lipasi gastrica e, nel giovane, chimosina (rennina)."},{"t":6,"q":"Le ghiandole piloriche contengono cellule endocrine che producono:","o":["Gastrina","Insulina","Secretina","Colecistochinina"],"e":"Le cellule G della regione pilorica secernono gastrina, che stimola la secrezione acida."},{"t":6,"q":"Nello stomaco la mucosa presenta:","o":["Fossette gastriche in cui sboccano le ghiandole","Villi intestinali rivestiti da enterociti","Cripte di Lieberkühn con cellule di Paneth","Placche di Peyer con centri germinativi"],"e":"Le ghiandole gastriche si aprono sul fondo delle fossette gastriche."},{"t":6,"q":"Le cellule di Paneth dell'intestino tenue sono presenti in:","o":["Uomo, cane e ruminanti","Gatto, suino e cavallo","Gatto, cane e suino","Cavallo, suino e gatto"],"e":"Risposta della chiave d'esame: le cellule di Paneth, sul fondo delle cripte, secernono lisozima e peptidi antimicrobici."},{"t":6,"q":"La superficie luminale dell'intestino tenue:","o":["Ha un aspetto vellutato per la presenza dei villi","Ha un aspetto liscio per l'assenza di villi","Ha un aspetto pieghettato per la presenza di papille","Ha un aspetto rugoso per la presenza di fossette gastriche"],"e":"I villi, con i microvilli degli enterociti, moltiplicano la superficie di assorbimento."},{"t":6,"q":"L'intestino possiede innervazione:","o":["Simpatica, parasimpatica e intrinseca (enterica), ma non somatica","Simpatica e somatica, ma non parasimpatica","Esclusivamente intrinseca (enterica)","Somatica e parasimpatica, ma non simpatica"],"e":"L'innervazione estrinseca è autonoma (simpatico e parasimpatico); quella intrinseca è il sistema nervoso enterico."},{"t":6,"q":"Nell'intestino crasso dei carnivori:","o":["L'epitelio è pavimentoso stratificato a livello del canale anale e ricco di cellule caliciformi nel resto","L'epitelio è pavimentoso stratificato in tutta l'estensione","L'epitelio è cilindrico con villi e cellule di Paneth","L'epitelio è privo di cellule caliciformi e ricco di cellule parietali"],"e":"L'epitelio cilindrico ricco di caliciformi diventa pavimentoso stratificato solo nel canale anale."},{"t":6,"q":"L'intestino crasso è specializzato nella fermentazione:","o":["Negli erbivori monogastrici, non nei poligastrici","Nei poligastrici, non negli erbivori monogastrici","In tutti gli erbivori allo stesso modo","Nei carnivori, non negli erbivori"],"e":"Cavallo e coniglio fermentano nel cieco e nel colon; i ruminanti lo fanno nei prestomaci."},{"t":6,"q":"La mucosa dell'intestino crasso:","o":["È priva di villi, ma le cellule epiteliali presentano microvilli","Presenta villi, ma le cellule epiteliali sono prive di microvilli","È priva sia di villi sia di microvilli","Presenta villi lunghi come nel duodeno"],"e":"I villi sono esclusivi del tenue; i microvilli dell'orletto striato sono presenti anche nel crasso."},{"t":6,"q":"La parte esocrina del pancreas produce:","o":["Alfa-amilasi, lipasi, proteasi ed elastasi","Insulina, glucagone e somatostatina","Gastrina e acido cloridrico","Pepsinogeno e chimosina"],"e":"Gli enzimi digestivi sono prodotti dagli acini; insulina, glucagone e somatostatina dalle isole (parte endocrina)."},{"t":6,"q":"Le cellule A (alfa) delle isole pancreatiche secernono:","o":["Glucagone","Insulina","Somatostatina","Polipeptide pancreatico"],"e":"Cellule A: glucagone; cellule B: insulina; cellule D: somatostatina; cellule PP: polipeptide pancreatico."},{"t":6,"q":"Quali sono le cellule maggiormente rappresentate nelle isole di Langerhans?","o":["Cellule beta (B)","Cellule alfa (A)","Cellule delta (D)","Cellule PP (F)"],"e":"Le cellule B, produttrici di insulina, costituiscono la maggior parte delle cellule insulari."},{"t":6,"q":"Per intestino cefalico si intende:","o":["La cavità orale e la cavità faringea","L'esofago e lo stomaco","Il duodeno e il digiuno","La faringe e l'esofago"],"e":"L'intestino cefalico è il tratto del canale alimentare contenuto nella testa."},{"t":6,"q":"Segna l'affermazione errata riguardo al cercine gengivale (cuscinetto dentale) dei ruminanti:","o":["Presenta cellule epiteliali speciali fusiformi che formano pori gustativi","Sostituisce gli incisivi superiori","È rivestito da epitelio pavimentoso stratificato cheratinizzato","Funge da superficie contro cui gli incisivi inferiori strappano l'erba"],"e":"Il cuscinetto dentale è una struttura cheratinizzata priva di calici gustativi."},{"t":6,"q":"Il muscolo stiloglosso è:","o":["Un muscolo estrinseco della lingua","Un muscolo intrinseco della lingua","Un muscolo della faringe","Un muscolo masticatorio"],"e":"I muscoli estrinseci (stiloglosso, ioglosso, genioglosso) originano da ioide e mandibola e muovono l'intera lingua."},{"t":7,"q":"La cavità pulpare del dente è ricca in:","o":["Vasi sanguigni, linfatici e nervi","Cristalli di idrossiapatite e fibre collagene","Ameloblasti e odontoblasti in attività secretoria","Cemento e legamento parodontale"],"e":"La polpa è connettivo lasso vascolarizzato e innervato, delimitato dagli odontoblasti."},{"t":7,"q":"Il cemento ricopre esclusivamente la radice nei denti:","o":["Brachiodonti","Ipsodonti","Elodonti","Di tutte le tipologie"],"e":"Nei denti ipsodonti (cavallo, ruminanti) il cemento ricopre anche la corona; nei brachiodonti (carnivori, uomo) solo la radice."},{"t":7,"q":"L'azione di espulsione (eruzione) del dente da parte dell'osso alveolare:","o":["È più prolungata nel dente ipsodonte","È più prolungata nel dente brachiodonte","Ha la stessa durata in tutti i tipi di dente","Si esaurisce prima nel dente ipsodonte"],"e":"Il dente ipsodonte continua a erompere per anni, compensando l'usura della tavola occlusale."},{"t":7,"q":"La struttura più dura e resistente dell'organismo è:","o":["Lo smalto","La dentina","Il cemento","L'osso compatto"],"e":"Lo smalto è costituito per oltre il 95% da cristalli di idrossiapatite."},{"t":7,"q":"Nei ruminanti adulti il numero di denti dell'arcata mascellare (superiore):","o":["È minore di quello dell'arcata mandibolare","È maggiore di quello dell'arcata mandibolare","È uguale a quello dell'arcata mandibolare","È variabile a seconda del sesso"],"e":"Nei ruminanti mancano incisivi e canini superiori, sostituiti dal cuscinetto dentale."},{"t":7,"q":"Nei molari permanenti del cavallo si riconosce:","o":["Un margine occlusale","Un margine incisivo","Un margine gengivale","Un margine radicolare"],"e":"La tavola occlusale dei denti giugali equini è una superficie di abrasione con creste di smalto."},{"t":7,"q":"Sulla faccia occlusale di un dente ipsodonte moderatamente abrasa dalla masticazione, quanti tessuti dentali si possono individuare?","o":["Due","Uno","Tre","Quattro"],"e":"Risposta della chiave d'esame."},{"t":7,"q":"Nei denti della dentizione permanente la cavità della polpa dentaria è:","o":["Più ampia nel dente di un animale giovane","Più ampia nel dente di un animale vecchio","Di dimensioni costanti per tutta la vita","Assente nel dente di un animale giovane"],"e":"Con l'età gli odontoblasti depositano dentina secondaria e la camera pulpare si restringe."},{"t":8,"q":"I dotti epatici (destro e sinistro):","o":["Escono dall'ilo del fegato appaiati alla vena porta e trasportano bile","Entrano nell'ilo del fegato appaiati all'arteria epatica e trasportano sangue","Escono dalla cistifellea e trasportano linfa","Entrano nel duodeno appaiati al dotto pancreatico e trasportano chimo"],"e":"I dotti epatici confluiscono nel dotto epatico comune, che con il dotto cistico forma il coledoco."},{"t":8,"q":"I lobuli epatici sono:","o":["Strutture microscopiche a forma di poliedro caratteristiche del fegato dei mammiferi","Strutture macroscopiche a forma di poliedro esclusive del fegato di suino","Strutture microscopiche a forma sferica caratteristiche del fegato degli uccelli","Strutture macroscopiche a forma di cuneo delimitate dalle vene epatiche"],"e":"Il lobulo classico è poliedrico, centrato sulla vena centrolobulare; nel suino è reso evidente da setti connettivali."},{"t":8,"q":"Nel fegato gli epatociti:","o":["Sono provvisti di microvilli","Sono provvisti di ciglia","Sono privi di microvilli","Sono provvisti di stereociglia"],"e":"I microvilli del versante sinusoidale sporgono nello spazio di Disse e aumentano la superficie di scambio."},{"t":8,"q":"Lo spazio di Disse è:","o":["Una zona dove avvengono scambi di sostanze tra epatociti e plasma sanguigno","Una zona dove avviene la produzione della bile tra epatociti adiacenti","Una zona dove il sangue portale si mescola con quello arterioso","Una zona dove la bile si raccoglie prima di entrare nei dotti biliari"],"e":"È lo spazio perisinusoidale tra endotelio fenestrato ed epatociti, attraversato dal plasma."},{"t":8,"q":"Le cellule stellate (di Ito):","o":["Immagazzinano vitamina A e vescicole lipidiche e producono collagene e reticolina","Immagazzinano vitamina K e glicogeno e producono albumina e fibrinogeno","Fagocitano eritrociti invecchiati e producono bilirubina","Immagazzinano ferro e producono gli acidi biliari"],"e":"Le cellule di Ito, nello spazio di Disse, accumulano vitamina A e producono la matrice connettivale; attivate, causano fibrosi."},{"t":8,"q":"La direzione del flusso sanguigno dalle vene interlobulari alla vena centrale:","o":["È opposta a quella della bile nei canalicoli e dotti biliari","È concorde con quella della bile nei canalicoli e dotti biliari","È perpendicolare a quella della bile","È indipendente e variabile rispetto a quella della bile"],"e":"Il sangue scorre dalla periferia al centro del lobulo, la bile dal centro alla periferia verso i dotti della triade."},{"t":8,"q":"I canalicoli biliari sono:","o":["Depressioni a forma di doccia sulle facce contrapposte di epatociti adiacenti","Dotti rivestiti da epitelio cubico situati nella triade portale","Capillari sinusoidali rivestiti da endotelio fenestrato","Tubuli rivestiti da cellule di Kupffer"],"e":"Il canalicolo non ha parete propria: è delimitato dalle membrane di due epatociti unite da giunzioni serrate."},{"t":8,"q":"Il dotto coledoco:","o":["Porta la bile dal fegato (e dalla cistifellea) al duodeno","Porta la b
