<style>

  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;

        --accent:#6FB4C8; --accent-ink:#0F1F26; --ok:#6CC49A; --ok-bg:#1E3A2F; --ko:#E08585; --ko-bg:#432727;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}

h1{font-family:var(--serif);font-weight:600;font-size:1.65rem;line-height:1.15;margin:0 0 4px;letter-spacing:-0.01em}

.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.stats{display:flex;gap:14px;font-size:.92rem;color:var(--ink2)}
.stats b{color:var(--ink);font-weight:600}
select{font:inherit;font-size:.92rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%}
.map{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin:8px 0 18px}
.seg{height:10px;border-radius:2px;background:var(--line);border:0;padding:0;cursor:pointer}
.seg.ok{background:var(--ok)} .seg.ko{background:var(--ko)}
.seg.cur{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 18px 18px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--ink2);margin-bottom:12px}
.meta .topic{color:var(--accent);font-weight:600}
.q{font-family:var(--serif);font-size:1.22rem;line-height:1.4;margin:0 0 18px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:1rem;line-height:1.4;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .key{flex:0 0 auto;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1px solid var(--line);font-size:.8rem;display:grid;place-items:center;color:var(--ink2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)} .opt.ko .key{background:var(--ko);border-color:var(--ko);color:#fff}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:.95rem;border-left:4px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.ko{background:var(--ko-bg);border-color:var(--ko)}
.fb b{display:block;margin-bottom:4px}
.nav{display:flex;gap:10px;margin-top:14px}
.btn{font:inherit;font-size:.95rem;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tools .btn{flex:0 0 auto;font-size:.88rem;padding:8px 12px;background:transparent}
.summary{margin-top:6px}
.summary h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 6px}
.score{font-family:var(--serif);font-size:2.2rem;line-height:1;margin:6px 0 14px}
.score small{font-family:var(--sans);font-size:.95rem;color:var(--ink2);margin-left:8px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.trow .track{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.trow .fill{height:100%;background:var(--ok)}
.summary h3{font-size:1rem;margin:22px 0 6px}
.err{border-top:1px solid var(--line);padding:12px 0}
.err .qq{font-family:var(--serif);font-size:1.02rem;margin:0 0 6px}
.err p{margin:3px 0;font-size:.9rem}
.err .ko{color:var(--ko)} .err .ok{color:var(--ok)}
.err .why{color:var(--ink2)}
.empty{color:var(--ink2);font-size:.92rem}
.hidden{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.opt,.seg{transition:background-color .15s,border-color .15s}}
@media (max-width:420px){.wrap{padding:16px 12px 40px} .q{font-size:1.14rem} .map{grid-template-columns:repeat(20,1fr)}}

<script>
const TOPICS = ["Generalità e funzioni delle vie aerifere", "Componenti e delimitazione ossea", "Setto nasale, vestibolo e conche", "Conche e meati nasali", "Mucosa nasale: struttura generale", "Regione cutanea", "Regione respiratoria: epitelio", "Regione respiratoria: propria-sottomucosa", "Regione olfattiva", "Cellule olfattive e via olfattiva", "Organo vomeronasale", "Innervazione della mucosa nasale", "Strutture annesse e seni paranasali", "Ghiandola nasale laterale e dotto nasolacrimale", "Funzioni delle cavità nasali e respirazione orale", "Coana e rinofaringe", "Organi linfatici"];
const DATA = [{"t":0,"q":"Qual è la funzione principale dell'apparato respiratorio secondo la definizione funzionale del corso?","o":["Provvedere agli scambi dei gas respiratori (ossigeno e anidride carbonica) tra organismo ed esterno","Produrre energia per le cellule mediante l'ossidazione dei nutrienti","Regolare la temperatura corporea attraverso la ventilazione","Filtrare il sangue dalle sostanze di scarto del metabolismo"],"e":"L'apparato mette in comunicazione l'ambiente esterno con il sangue per far entrare l'ossigeno ed eliminare l'anidride carbonica; la produzione di energia avviene nelle cellule, non nell'apparato respiratorio."},{"t":0,"q":"Dal punto di vista funzionale, l'apparato respiratorio è diviso in due grandi sistemi. Quali?","o":["Sistema di conduzione dell'aria e sistema di scambio gassoso sangue-aria (ematosi)","Vie aerifere superiori e vie aerifere inferiori","Sistema di ventilazione e sistema di perfusione","Naso e polmoni"],"e":"La divisione funzionale distingue le vie aerifere (conduzione e condizionamento dell'aria) dagli alveoli, sede dell'ematosi. Superiori/inferiori è una suddivisione topografica delle sole vie aerifere."},{"t":0,"q":"Le vie aerifere non sono semplici «tubi» di passaggio. Quale compito aggiuntivo svolgono?","o":["Preparano e modificano l'aria prima che raggiunga le zone più delicate del polmone","Realizzano una parte degli scambi gassosi con il sangue","Producono il surfattante alveolare","Regolano la gittata del ventricolo destro"],"e":"Le vie aerifere condizionano l'aria (depurazione, riscaldamento, umidificazione); gli scambi gassosi avvengono esclusivamente negli alveoli."},{"t":0,"q":"Con il termine «ematosi» si indica:","o":["Lo scambio gassoso tra aria alveolare e sangue dei capillari polmonari","Il trasporto dell'aria lungo le vie aerifere","La produzione di cellule del sangue nel midollo osseo","La clearance mucociliare delle vie aerifere superiori"],"e":"L'ematosi è lo scambio sangue-aria che avviene negli alveoli attraverso la barriera aria-sangue; la produzione di cellule del sangue è l'ematopoiesi."},{"t":0,"q":"Perché la barriera aria-sangue alveolare deve essere molto sottile?","o":["Per permettere il passaggio rapido dell'ossigeno dall'aria al sangue e dell'anidride carbonica dal sangue all'aria","Per aumentare la resistenza meccanica dell'alveolo durante l'inspirazione","Per impedire il passaggio dei gas e trattenere l'aria negli alveoli","Per consentire il passaggio dei leucociti verso il lume alveolare"],"e":"La sottigliezza della barriera riduce la distanza di diffusione dei gas: è la condizione che rende efficiente l'ematosi."},{"t":0,"q":"Quale quota della gittata del ventricolo destro raggiunge il letto capillare polmonare?","o":["L'intera gittata del ventricolo destro","Circa la metà; il resto raggiunge le arterie bronchiali","Solo la quota destinata alla nutrizione del parenchima polmonare","Una quota variabile in funzione dell'attività fisica"],"e":"Il letto capillare polmonare, molto esteso, riceve tutto il sangue pompato dal ventricolo destro, che viene ossigenato negli alveoli."},{"t":0,"q":"In che modo l'apparato respiratorio influenza l'equilibrio acido-base dell'organismo?","o":["Regolando l'eliminazione dell'anidride carbonica, che è collegata alla regolazione del pH","Secernendo bicarbonato attraverso le ghiandole della mucosa nasale","Assorbendo acidi volatili dall'aria inspirata","Eliminando ioni idrogeno con il muco deglutito"],"e":"L'anidride carbonica è legata alla regolazione del pH: modificarne l'eliminazione con la ventilazione significa influenzare direttamente l'acidità o basicità dell'organismo."},{"t":0,"q":"Il principio della clearance mucociliare delle vie aerifere superiori si riassume in:","o":["Il muco intrappola le particelle, le ciglia le trasportano verso la faringe, dove il materiale viene deglutito","Le ciglia intrappolano le particelle e il muco le scioglie chimicamente","Il muco viene espulso verso le narici per starnuto riflesso","Le particelle vengono fagocitate dalle cellule ciliate e digerite nell'epitelio"],"e":"Il muco intrappola, le ciglia trasportano: il materiale spinto in faringe viene generalmente deglutito. È questo il meccanismo che protegge le vie respiratorie profonde."},{"t":1,"q":"Quali strutture compongono le vie aerifere superiori secondo il corso?","o":["Naso esterno con le narici, cavità nasali con seni e recessi paranasali, rinofaringe","Naso esterno, cavità nasali, faringe intera e laringe","Cavità nasali, cavità orale e laringe","Narici, cavità nasali e trachea"],"e":"La faringe è un incrocio tra via respiratoria e digerente, ma solo la sua porzione nasale (rinofaringe) appartiene alle vie aerifere; la laringe non è compresa tra le vie superiori descritte."},{"t":1,"q":"Perché la faringe è definita una regione «particolare» nell'ambito delle vie aerifere?","o":["Rappresenta un incrocio tra via respiratoria e via digerente, ma la sua parte nasale (rinofaringe) appartiene esclusivamente alla via respiratoria","È l'unica porzione delle vie aerifere priva di mucosa","Contiene l'epitelio olfattivo accessorio","È rivestita da epitelio pavimentoso in tutta la sua estensione"],"e":"La faringe è attraversata sia dall'aria sia dal cibo; la rinofaringe, però, è esclusivamente aerifera."},{"t":1,"q":"Il naso esterno rappresenta:","o":["La parte più rostrale dell'apparato respiratorio, attraverso le cui narici l'aria entra nelle cavità nasali","La porzione caudale delle cavità nasali che continua nella faringe","Una struttura annessa priva di funzione respiratoria","La sede dell'epitelio olfattivo"],"e":"Il naso esterno è l'estremità rostrale (anteriore) dell'apparato; l'epitelio olfattivo si trova nella regione dorso-caudale delle cavità nasali."},{"t":1,"q":"Quali ossa delimitano dorsalmente le cavità nasali?","o":["Le ossa nasali","Le ossa mascellari","I processi palatini delle ossa incisive","Le lamine dei palatini"],"e":"Dorsalmente le cavità nasali sono chiuse dalle ossa nasali; le mascellari le delimitano lateralmente, mentre incisive, mascellari e palatini formano il pavimento ventrale."},{"t":1,"q":"Il pavimento (delimitazione ventrale) delle cavità nasali è formato da:","o":["Processi palatini delle ossa incisive e delle ossa mascellari e lamine dei palatini","Lamina cribrosa dell'etmoide e ossa nasali","Ossa frontali e ossa lacrimali","Lamina perpendicolare dell'etmoide e cresta conchale"],"e":"Ventralmente le cavità nasali poggiano sul palato duro osseo, formato dai processi palatini di incisive e mascellari e dalle lamine dei palatini."},{"t":1,"q":"Quale struttura chiude caudalmente le cavità nasali e perché è funzionalmente importante?","o":["La lamina cribrosa dell'etmoide, attraversata dalle fibre del nervo olfattivo dirette al bulbo olfattivo","La lamina perpendicolare dell'etmoide, che separa le due cavità nasali","Il palato molle, che separa la cavità nasale dalla rinofaringe","La cresta conchale, che sostiene la conca ventrale"],"e":"La lamina cribrosa è il limite caudale delle cavità nasali: i fascetti del nervo olfattivo la attraversano per raggiungere il bulbo olfattivo, situato subito sopra."},{"t":2,"q":"Le due cavità nasali sono separate tra loro da:","o":["Il setto nasale cartilagineo, completato caudalmente dalla lamina perpendicolare dell'etmoide","La lamina cribrosa dell'etmoide","Il palato duro","Il labirinto etmoidale"],"e":"Il setto è cartilagineo rostralmente e osseo (lamina perpendicolare dell'etmoide) caudalmente; la lamina cribrosa chiude le cavità caudalmente, non le separa tra loro."},{"t":2,"q":"Il setto nasale si unisce ventralmente al palato duro. Quale conseguenza funzionale ne deriva?","o":["Aria e cibo percorrono vie separate: l'aria passa nelle cavità nasali, il cibo nella cavità orale","L'aria inspirata raggiunge direttamente la cavità orale","Il setto impedisce la comunicazione tra cavità nasale e rinofaringe","Il palato duro partecipa al riscaldamento dell'aria espirata"],"e":"Il palato duro separa le cavità nasali dalla cavità orale, mantenendo distinte, in condizioni normali, la via respiratoria e la via digerente."},{"t":2,"q":"Le cavità nasali comunicano con l'esterno attraverso:","o":["Le narici e il vestibolo del naso","Le coane","I dotti incisivi","I meati etmoidali"],"e":"Narici e vestibolo sono l'accesso esterno; le coane sono invece l'apertura caudale verso la rinofaringe."},{"t":2,"q":"Perché lo spazio interno delle cavità nasali non è un lume ampio e libero?","o":["È ridotto dalla presenza delle ossa turbinate (conche nasali), rivestite da mucosa ispessita e ricca di plesso vascolare","È occupato dai seni paranasali","È attraversato dal setto nasale in senso trasversale","È occupato dalla tonsilla faringea"],"e":"Le conche si proiettano nel lume e ne riducono lo spazio libero, aumentando però la superficie di contatto tra aria e mucosa."},{"t":2,"q":"Il significato funzionale principale delle conche nasali è:","o":["Aumentare enormemente la superficie di contatto tra aria e mucosa, potenziando riscaldamento, umidificazione e filtrazione","Alleggerire il cranio e favorire la risonanza","Ospitare l'organo vomeronasale","Convogliare tutta l'aria inspirata verso la mucosa olfattiva"],"e":"Più superficie di mucosa significa maggiore capacità di condizionare l'aria; alleggerimento e risonanza sono funzioni dei seni paranasali."},{"t":3,"q":"A quale endoturbinato corrisponde la conca nasale dorsale?","o":["Endoturbinato I","Endoturbinato II","Endoturbinato III","A nessuno: la conca dorsale dipende dalla cresta conchale"],"e":"La conca dorsale è l'endoturbinato I, la conca media l'endoturbinato II; la conca ventrale non ha rapporto con l'etmoide ed è legata alla cresta conchale."},{"t":3,"q":"Quale conca nasale non è in rapporto con l'etmoide?","o":["La conca ventrale, legata alla cresta conchale","La conca dorsale","La conca media","Tutte le conche derivano dall'etmoide"],"e":"Dorsale (endoturbinato I) e media (endoturbinato II) sono etmoidali; la conca ventrale si inserisce sulla cresta conchale."},{"t":3,"q":"Il labirinto etmoidale è:","o":["L'insieme delle conche etmoidali, numerose e formate da fragili lamine ossee, situato caudalmente nella cavità nasale","Il sistema dei seni paranasali dell'osso frontale","Il plesso di venule della mucosa respiratoria","La rete di dotti dell'organo vomeronasale"],"e":"Il labirinto etmoidale deriva da un accrescimento dell'osso etmoidale ed è formato da conche sottili separate dai meati etmoidali."},{"t":3,"q":"Quale meato nasale rappresenta la via principale attraverso cui l'aria raggiunge la faringe?","o":["Il meato ventrale, detto anche meato respiratorio","Il meato dorsale, detto anche meato olfattorio","Il meato medio, detto anche meato sinusale","Il meato comune, in prossimità del setto"],"e":"Il meato ventrale conduce verso la faringe ed è detto respiratorio; il dorsale porta alla mucosa olfattiva, il medio comunica con i seni paranasali, il comune è vicino al setto."},{"t":3,"q":"Il meato medio è detto anche «sinusale» perché:","o":["Comunica con i seni paranasali","Conduce all'organo vomeronasale","È in rapporto con il plesso venoso della mucosa","Rappresenta la via principale verso la faringe"],"e":"Il meato medio mette in comunicazione la cavità nasale con i seni paranasali; la via principale verso la faringe è il meato ventrale."},{"t":4,"q":"Il muco che protegge l'epitelio delle cavità nasali contiene:","o":["Cellule epiteliali staccate, leucociti e mucina prodotta da ghiandole specializzate","Surfattante, macrofagi alveolari e IgE","Solo acqua ed elettroliti secreti dalle cellule ciliate","Cheratina e lipidi delle ghiandole sebacee"],"e":"Il muco è formato da mucina di origine ghiandolare e contiene elementi cellulari (cellule desquamate, leucociti) intrappolati."},{"t":4,"q":"La propria-sottomucosa delle cavità nasali è formata da:","o":["Tessuto connettivo lasso con linfociti T, capillari, fibre nervose e, in alcuni punti, ghiandole","Tessuto muscolare striato con ghiandole miste","Cartilagine ialina e osso lamellare","Tessuto connettivo denso privo di vasi"],"e":"Sotto l'epitelio si trova connettivo lasso ricco di elementi immunitari, vasi e fibre nervose."},{"t":4,"q":"I «corpi cavernosi» della mucosa nasale sono:","o":["Un plesso di venule che, riempiendosi più o meno di sangue, modifica il grado di congestione della mucosa","Ghiandole miste della regione olfattiva","Noduli linfatici della rinofaringe","Cavità ossee ripiene d'aria che alleggeriscono il cranio"],"e":"I corpi cavernosi sono il plesso venoso della mucosa: il loro riempimento regola la congestione e quindi il passaggio dell'aria."},{"t":4,"q":"Le cavità nasali si dividono in tre regioni. Quali?","o":["Regione cutanea, regione respiratoria e regione olfattiva","Regione vestibolare, regione conchale e regione etmoidale","Regione rostrale, regione media e regione faringea","Regione mucosa, regione sierosa e regione ghiandolare"],"e":"La suddivisione è istologica e funzionale: ciascuna regione ha epitelio e funzione diversi."},{"t":5,"q":"Dove si trova la regione cutanea delle cavità nasali?","o":["Nella porzione più rostrale del vestibolo nasale","Nella porzione dorso-caudale della cavità nasale","Nei due terzi centrali della cavità nasale","Nella rinofaringe, dorsalmente al palato molle"],"e":"La regione cutanea è la zona iniziale del vestibolo; nella porzione dorso-caudale si trova invece la regione olfattiva."},{"t":5,"q":"Quale epitelio riveste la porzione rostrale del vestibolo nasale e a cosa è adatto?","o":["Epitelio pavimentoso stratificato cheratinizzato ispessito, adatto a sopportare sfregamenti e stimoli meccanici","Epitelio cilindrico pseudostratificato ciliato, adatto al trasporto del muco","Epitelio batiprismatico con cellule bipolari, adatto alla percezione degli odori","Epitelio cubico semplice, adatto agli scambi gassosi"],"e":"È un epitelio simile a quello della cute, che protegge dal contatto con particelle esterne; nella zona media del vestibolo diventa più sottile e non cheratinizzato."},{"t":5,"q":"Nella zona media del vestibolo nasale l'epitelio:","o":["Diventa più sottile e non cheratinizzato","Diventa ciliato e ricco di cellule caliciformi","Si trasforma in epitelio olfattivo","Scompare, lasciando esposta la propria-sottomucosa"],"e":"Il vestibolo mostra una transizione: cheratinizzato e ispessito rostralmente, sottile e non cheratinizzato nella zona media."},{"t":5,"q":"Le papille di tessuto connettivo della regione cutanea contengono:","o":["Piccoli vasi e cellule libere del connettivo come mastociti, plasmacellule, linfociti, macrofagi e granulociti","Neuroni bipolari e peli olfattivi","Ghiandole vomeronasali","Cellule caliciformi e cellule sierose"],"e":"La propria-sottomucosa si interdigita con l'epitelio tramite papille ricche di cellule immunitarie; più in profondità si trovano fibre collagene, grossi vasi e ghiandole sierose."},{"t":5,"q":"Quale caratteristica presenta la regione cutanea del vestibolo nasale del cavallo?","o":["L'apertura di un diverticolo nasale rivestito da pelle con vibrisse, ghiandole sebacee e sudoripare","L'apertura dei dotti incisivi","La ghiandola nasale laterale, molto sviluppata","Una tasca gutturale rivestita da mucosa respiratoria"],"e":"Il diverticolo nasale è una peculiarità equina; i dotti incisivi mancano proprio nel cavallo e la ghiandola nasale laterale è sviluppata nei carnivori."},{"t":6,"q":"Quale estensione occupa la regione respiratoria nelle cavità nasali?","o":["Circa i due terzi della cavità nasale, esclusa la mucosa olfattiva","Solo il vestibolo nasale","L'intera cavità nasale, compresa la regione olfattiva","Circa un decimo, limitatamente al meato ventrale"],"e":"La regione respiratoria è la più estesa delle tre: circa due terzi della cavità nasale."},{"t":6,"q":"Fino a quale livello delle vie aerifere si ritrova l'epitelio di tipo respiratorio?","o":["Fino ai bronchioli terminali, con eccezioni in alcune porzioni di faringe e laringe","Solo fino alle coane","Fino agli alveoli polmonari compresi","Solo nelle cavità nasali e nei seni paranasali"],"e":"L'epitelio respiratorio riveste la via aerifera dalla cavità nasale ai bronchioli terminali; gli alveoli hanno un epitelio specializzato per gli scambi gassosi."},{"t":6,"q":"L'epitelio respiratorio è definito «pseudostratificato» perché:","o":["Sembra formato da più strati, ma tutte le cellule poggiano sulla membrana basale pur non raggiungendo tutte la superficie","È formato da due strati distinti di cellule sovrapposte","Le cellule sono disposte in un unico strato di uguale altezza","È privo di membrana basale"],"e":"I nuclei a diverse altezze simulano una stratificazione, ma ogni cellula è in contatto con la membrana basale."},{"t":6,"q":"Quale funzione svolgono le cellule ciliate dell'epitelio respiratorio?","o":["Trasportano il muco verso la faringe grazie al battito coordinato delle ciglia","Metabolizzano sostanze xenobiotiche","Percepiscono stimoli attraverso recettori collegati al trigemino","Producono mucina ricca di glicoproteine acide"],"e":"Le cellule ciliate sono batiprismatiche, dotate di ciglia mobili e microvilli; il loro compito principale è il trasporto del muco."},{"t":6,"q":"Le cellule con orletto a spazzola dell'epitelio respiratorio hanno funzione:","o":["Sensoriale, grazie a grossi microvilli con recettori in rapporto con terminazioni di fibre trigeminali","Di trasporto del muco","Di rinnovamento dell'epitelio","Secretoria di glicoproteine neutre"],"e":"L'orletto a spazzola è formato da grossi microvilli recettoriali collegati al trigemino: la cellula funge da sensore."},{"t":6,"q":"Le cellule con microvilli, indicate nel corso come cellule «senza nome», sono capaci di:","o":["Metabolizzare sostanze xenobiotiche, cioè estranee all'organismo","Produrre le IgA secretorie","Generare l'impulso olfattivo","Dividersi per rinnovare l'epitelio"],"e":"Il loro ruolo è la detossificazione di composti estranei inalati; le IgA sono prodotte dalle ghiandole della propria-sottomucosa e il rinnovamento spetta alle cellule basali."},{"t":6,"q":"Le cellule basali dell'epitelio respiratorio:","o":["Poggiano sulla membrana basale e si dividono e differenziano per rimpiazzare le altre cellule dell'epitelio","Raggiungono la superficie e portano ciglia mobili","Secernono muco ricco di acido sialico","Sono neuroni bipolari"],"e":"Le cellule basali sono la riserva proliferativa dell'epitelio."},{"t":6,"q":"I granuli delle cellule caliciformi mucose sono:","o":["Elettrotrasparenti e ricchi di glicoproteine acide con gruppi solforici e acido sialico","Piccoli e contenenti glicoproteine neutre","Elettrondensi e ricchi di lisozima","Contenenti cheratina"],"e":"Le caliciformi producono la componente acida del muco; le cellule sierose hanno granuli più piccoli con glicoproteine neutre."},{"t":6,"q":"Cosa distingue le cellule sierose dalle cellule caliciformi nell'epitelio respiratorio?","o":["Le sierose hanno granuli più piccoli contenenti glicoproteine neutre","Le sierose sono ciliate, le caliciformi no","Le sierose sono neuroni, le caliciformi cellule epiteliali","Le sierose producono glicoproteine acide solforate"],"e":"Entrambe sono cellule secernenti, ma differiscono per dimensione dei granuli e natura delle glicoproteine: neutre nelle sierose, acide nelle caliciformi."},{"t":7,"q":"Nella regione respiratoria la propria-sottomucosa forma:","o":["Uno strato cavernoso molto vascolarizzato, con arterie e grosse vene a parete sottile orientate in senso rostrocaudale","Uno strato di cartilagine ialina di sostegno","Uno strato di muscolatura striata","Uno strato adiposo isolante"],"e":"Lo strato cavernoso è molto più vascolarizzato della propria-sottomucosa delle regioni cutanea e olfattiva."},{"t":7,"q":"Perché le vene dello strato cavernoso sono definite «vasi capacitanti»?","o":["Perché sono interconnesse e possono contenere quantità variabili di sangue, determinando il grado di congestione della mucosa","Perché trasportano sangue arterioso ad alta pressione","Perché sono dotate di valvole che impediscono il reflusso","Perché la loro parete è spessa e muscolare"],"e":"La capacità di riempirsi o svuotarsi regola il volume della mucosa e quindi il flusso d'aria nel lume nasale."},{"t":7,"q":"La costrizione dei vasi capacitanti della mucosa nasale è stimolata da:","o":["Fibre alfa-adrenergiche del sistema nervoso simpatico","Fibre parasimpatiche colinergiche","Fibre del nervo olfattivo","Fibre sensitive del trigemino"],"e":"Lo stimolo simpatico alfa-adrenergico costringe le vene, decongestiona la mucosa e aumenta il passaggio d'aria."},{"t":7,"q":"Quanto durano tipicamente i periodi di congestione dello strato cavernoso nei mammiferi?","o":["Da 30 minuti a 4 ore, alternati a periodi di decongestione","Pochi secondi, in sincronia con ogni ciclo respiratorio","Da 24 a 48 ore","Sono permanenti e non si alternano"],"e":"L'alternanza ciclica tra congestione e decongestione regola il flusso d'aria e la funzione della mucosa."},{"t":7,"q":"Quale effetto ha la congestione della mucosa nasale sul passaggio dell'aria?","o":["Lo riduce; il passaggio aumenta quando la mucosa è decongestionata","Lo aumenta, perché il sangue riscalda l'aria","Nessun effetto: il lume è determinato solo dalle ossa","Lo blocca completamente in entrambe le cavità"],"e":"Una mucosa congesta occupa più spazio nel lume e riduce il flusso; la decongestione lo aumenta."},{"t":7,"q":"Le ghiandole sierose o miste della propria-sottomucosa respiratoria secernono:","o":["IgA, lisozima e proteine leganti sostanze odorifere","Surfattante e fosfolipidi","Glicoproteine neutre nel dotto vomeronasale","Testosterone e feromoni"],"e":"Le IgA difendono la mucosa, il lisozima ha attività antibatterica, le proteine leganti aiutano trasporto e percezione delle molecole odorose."},{"t":7,"q":"Qual è il ruolo del lisozima secreto dalle ghiandole della mucosa nasale?","o":["Attività antibatterica","Trasporto delle molecole odorose ai recettori","Umidificazione dell'aria per evaporazione","Neutralizzazione degli antigeni tramite legame specifico"],"e":"Il lisozima è un enzima antibatterico; il legame specifico con gli antigeni è compito delle IgA, il trasporto degli odori delle proteine leganti sostanze odorifere."},{"t":8,"q":"Dove è localizzata la regione olfattiva della cavità nasale?","o":["Nella porzione dorso-caudale, comprendendo alcune conche etmoidali, il meato dorsale e parte del setto nasale","Nel vestibolo nasale, rostralmente","Lungo il meato ventrale, fino alle coane","Nel recesso mascellare, a livello del quarto premolare"],"e":"La regione olfattiva è dorso-caudale: solo una parte dell'aria inspirata viene convogliata verso questa zona specifica."},{"t":8,"q":"Rispetto alla mucosa respiratoria, la mucosa olfattiva è:","o":["Più spessa, rivestita da epitelio batiprismatico pseudostratificato ciliato","Più sottile e poco vascolarizzata","Più spessa, rivestita da epitelio pavimentoso cheratinizzato","Identica per spessore e tipo di epitelio"],"e":"La mucosa olfattiva è la più spessa; quella sottile e poco vascolarizzata è la mucosa dei seni paranasali."},{"t":8,"q":"Quali sono i tre tipi cellulari principali della mucosa olfattiva?","o":["Cellule olfattive, cellule di sostegno e cellule basali","Cellule ciliate, cellule caliciformi e cellule sierose","Cellule con orletto a spazzola, cellule basali e mastociti","Neuroni bipolari, astrociti e cellule di Schwann"],"e":"Le cellule olfattive sono neuroni, le cellule di sostegno le affiancano e le cellule basali rinnovano l'epitelio."},{"t":8,"q":"Le cellule di sostegno della mucosa olfattiva:","o":["Sono batiprismatiche, unite ai dendriti delle cellule olfattive mediante complessi di giunzione e rimpiazzate dalle cellule basali","Sono neuroni bipolari che trasmettono l'impulso al bulbo olfattivo","Sono cellule mucose che producono glicoproteine acide","Sono cellule ciliate che spingono il muco verso la faringe"],"e":"Hanno funzione di supporto; i neuroni sono le cellule olfattive."},{"t":8,"q":"Le ghiandole miste della propria-sottomucosa olfattiva hanno la funzione di:","o":["Umidificare la mucosa e «lavarla» dalle sostanze odorose già percepite, preparandola a nuovi stimoli","Secernere feromoni","Produrre il muco che intrappola il pulviscolo","Riscaldare l'aria inspirata"],"e":"Il ricambio del secreto elimina le molecole odorose già percepite e non più presenti nell'aria, così la mucosa è pronta a nuovi stimoli."},{"t":8,"q":"Perché la mucosa olfattiva deve essere mantenuta umida?","o":["Perché le molecole odorose devono sciogliersi nel secreto mucoso per essere riconosciute dai recettori","Per consentire il battito delle ciglia mobili","Per impedire la cheratinizzazione dell'epitelio","Per favorire la congestione dei corpi cavernosi"],"e":"La percezione olfattiva richiede la dissoluzione delle molecole odorose nel secreto ghiandolare."},{"t":9,"q":"Le cellule olfattive sono:","o":["Neuroni sensitivi bipolari, con un dendrite rivolto alla superficie e un assone diretto al sistema nervoso centrale","Cellule epiteliali ciliate specializzate nel trasporto del muco","Cellule gliali di sostegno","Cellule ghiandolari che secernono proteine leganti gli odori"],"e":"Sono veri neuroni, non semplici cellule epiteliali: è il punto fondamentale della regione olfattiva."},{"t":9,"q":"Il pirenoforo della cellula olfattiva è:","o":["Il corpo cellulare del neurone, situato nella porzione basale dell'epitelio","Il rigonfiamento apicale del dendrite da cui partono i peli olfattivi","L'assone amielinico che attraversa la lamina cribrosa","La giunzione con la cellula di sostegno"],"e":"Dal pirenoforo basale parte il dendrite, che termina in superficie con il bulbo dendritico."},{"t":9,"q":"I peli olfattivi sono:","o":["Sottili filamenti che originano dal bulbo dendritico ed espongono all'aria i recettori per le molecole odorose","Ciglia mobili che spingono il muco verso la faringe","Vibrisse del diverticolo nasale del cavallo","Microvilli delle cellule con orletto a spazzola"],"e":"È sui peli olfattivi che le molecole odorose vengono intercettate; non hanno la funzione motoria delle ciglia respiratorie."},{"t":9,"q":"Come si organizzano gli assoni delle cellule olfattive?","o":["Ogni cellula emette un singolo assone; gli assoni si riuniscono in fascetti amielinici che formano il nervo olfattivo","Ogni cellula emette più assoni mielinizzati che raggiungono direttamente la corteccia","Gli assoni terminano nella lamina propria, dove fanno sinapsi con il trigemino","Gli assoni si uniscono al nervo vomeronasale nel palato duro"],"e":"I fascetti amielinici attraversano la lamina cribrosa e raggiungono il bulbo olfattivo."},{"t":9,"q":"Il bulbo olfattivo si trova:","o":["Immediatamente sopra la lamina cribrosa dell'etmoide, nell'encefalo","Nel meato dorsale della cavità nasale","All'apice del dendrite della cellula olfattiva","Nel palato duro, accanto all'organo vomeronasale"],"e":"Il bulbo olfattivo è la prima stazione encefalica di elaborazione degli odori; il rigonfiamento apicale del dendrite è invece il bulbo dendritico."},{"t":9,"q":"Qual è la sequenza corretta del percorso dello stimolo olfattivo?","o":["Molecola odorosa → peli olfattivi → cellula olfattiva bipolare → assone → nervo olfattivo → lamina cribrosa → bulbo olfattivo","Molecola odorosa → cellula di sostegno → nervo trigemino → lamina perpendicolare → bulbo olfattivo","Molecola odorosa → cellula ciliata → muco → faringe → deglutizione","Molecola odorosa → organo vomeronasale → dotti incisivi → cavità orale"],"e":"La via olfattiva principale passa per la lamina cribrosa; il trigemino veicola sensibilità generale, non olfatto."},{"t":10,"q":"L'organo vomeronasale (organo di Jakobson) è formato da:","o":["Due sottili dotti paralleli, sostenuti da cartilagine ialina, situati nel palato duro ai lati della giunzione con il setto nasale","Un'unica cavità impari nel setto nasale cartilagineo","Due seni ossei nello spessore delle ossa mascellari","Un plesso di venule della mucosa respiratoria"],"e":"È una struttura pari e profonda, non libera nella cavità nasale."},{"t":10,"q":"In cosa si differenzia funzionalmente l'organo vomeronasale dall'epitelio olfattivo principale?","o":["Percepisce sostanze liquide poco volatili, spesso feromoni, mentre l'epitelio olfattivo percepisce molecole volatili","Percepisce stimoli irritativi e dolorifici","Percepisce le variazioni di temperatura dell'aria","Non ha funzione sensoriale, ma di drenaggio lacrimale"],"e":"È un organo chemorecettore specializzato per segnali chimici legati al comportamento sociale e riproduttivo."},{"t":10,"q":"Quale ruolo comportamentale è attribuito all'organo vomeronasale?","o":["Comportamento sessuale: nel maschio può contribuire all'aumento del testosterone, nella femmina è implicato nella cura della prole","Regolazione del ritmo respiratorio durante lo sforzo","Termoregolazione tramite evaporazione delle secrezioni","Controllo della deglutizione"],"e":"L'organo vomeronasale è coinvolto nel riconoscimento dei feromoni e quindi nei comportamenti riproduttivi e parentali."},{"t":10,"q":"Come terminano i dotti vomeronasali alle due estremità?","o":["Caudalmente a fondo cieco; rostralmente si aprono nei dotti incisivi","Caudalmente nelle coane; rostralmente nelle narici","Caudalmente nella rinofaringe; rostralmente a fondo cieco","A fondo cieco in entrambe le estremità"],"e":"L'apertura rostrale nei dotti incisivi collega l'organo alla cavità orale; nel cavallo i dotti incisivi mancano."},{"t":10,"q":"I dotti incisivi:","o":["Collegano la cavità nasale con la cavità orale attraverso aperture nel palato duro e mancano nel cavallo","Drenano le lacrime dal sacco congiuntivale al vestibolo nasale","Collegano i seni paranasali con il meato medio","Sono presenti solo nel cavallo, come il diverticolo nasale"],"e":"Il cavallo è l'eccezione: non possiede i dotti incisivi."},{"t":10,"q":"Dal punto di vista istologico, le pareti dell'organo vomeronasale sono rivestite:","o":["Parete laterale da epitelio respiratorio, parete mediale da epitelio olfattivo","Entrambe da epitelio pavimentoso stratificato cheratinizzato","Parete laterale da epitelio olfattivo, parete mediale da epitelio respiratorio","Entrambe da epitelio respiratorio ciliato"],"e":"La doppia natura (respiratoria sulla parete laterale, sensoriale su quella mediale) riflette la funzione dell'organo."},{"t":10,"q":"Le ghiandole vomeronasali riversano nel dotto un secreto costituito da:","o":["Glicoproteine neutre","Glicoproteine acide con acido sialico","IgA e lisozima","Sebo e cheratina"],"e":"La propria-sottomucosa dell'organo è riccamente vascolarizzata e contiene ghiandole vomeronasali a secreto neutro."},{"t":10,"q":"La reazione di Flehmen, tipica del cavallo, consiste nel:","o":["Sollevare il labbro superiore e modificare la posizione di bocca e naso per facilitare il trasporto di sostanze chimiche all'organo vomeronasale","Chiudere le narici per proteggere la mucosa da sostanze irritanti","Dilatare il diverticolo nasale per aumentare la ventilazione","Starnutire per espellere il muco dai meati"],"e":"È un comportamento legato al riconoscimento di segnali chimici e feromonali."},{"t":11,"q":"Quale nervo cranico è responsabile della sensibilità olfattiva?","o":["Il nervo olfattivo (I nervo cranico)","Il nervo trigemino (V nervo cranico)","Il nervo facciale (VII nervo cranico)","Il nervo vago (X nervo cranico)"],"e":"Il I nervo cranico veicola l'olfatto; il trigemino porta la sensibilità generale della mucosa."},{"t":11,"q":"Quali branche del trigemino innervano la mucosa nasale e che tipo di informazioni trasportano?","o":["Branca oftalmica (V1) e branca mascellare (V2); trasportano sensibilità generale: irritazione, dolore, temperatura, stimoli meccanici","Branca mandibolare (V3); trasporta informazioni odorose","Branche V1 e V2; trasportano informazioni olfattive","Branca V3; trasporta fibre motorie per la muscolatura del vestibolo"],"e":"Il trigemino non trasporta odori ma sensibilità generale, come il bruciore da sostanze irritanti."},{"t":11,"q":"Il bruciore provocato da una sostanza irritante inalata è percepito tramite:","o":["Le fibre sensitive del nervo trigemino","Le cellule olfattive bipolari e il nervo olfattivo","Il nervo vomeronasale","Le fibre parasimpatiche"],"e":"L'olfattivo percepisce gli odori, il trigemino gli stimoli irritativi e sensitivi generali."},{"t":11,"q":"Le fibre efferenti autonome (simpatiche e parasimpatiche) della mucosa nasale regolano principalmente:","o":["La vascolarizzazione e la secrezione ghiandolare della mucosa","La percezione degli odori","Il movimento delle vibrisse","La contrazione della muscolatura striata della rinofaringe"],"e":"Il simpatico alfa-adrenergico controlla i vasi capacitanti; il sistema autonomo nel complesso regola vasi e ghiandole."},{"t":11,"q":"Il nervo vomeronasale è collegato a:","o":["L'organo vomeronasale","La ghiandola nasale laterale","Il dotto nasolacrimale","La tonsilla faringea"],"e":"Il nervo vomeronasale è la seconda fonte di innervazione sensitiva della mucosa nasale, dedicata all'organo di Jakobson."},{"t":12,"q":"Quali strutture sono elencate come annesse alla cavità nasale?","o":["Dotto nasolacrimale, recessi e seni paranasali, organo vomeronasale, tube uditive e, negli Equidi, tasca gutturale","Laringe, trachea e bronchi","Tonsilla faringea, palato molle ed epiglottide","Ghiandole salivari, dotti incisivi e cavità orale"],"e":"Sono strutture non direttamente parte della via respiratoria principale, ma collegate anatomicamente e funzionalmente alla cavità nasale."},{"t":12,"q":"La tasca gutturale è una struttura annessa alla cavità nasale presente:","o":["Negli Equidi","Nei carnivori, in particolare nel cane","In tutti i mammiferi domestici","Solo nei ruminanti"],"e":"La tasca gutturale è una peculiarità degli Equidi."},{"t":12,"q":"I seni paranasali sono:","o":["Cavità ripiene d'aria nello spessore di alcune ossa craniche, in comunicazione con le cavità nasali","Plessi venosi della mucosa respiratoria","Dotti cartilaginei del palato duro","Recessi della rinofaringe che ospitano la tonsilla faringea"],"e":"Alleggeriscono il cranio, contribuiscono alla risonanza e sono in continuità con la cavità nasale."},{"t":12,"q":"La mucosa che riveste i seni paranasali è:","o":["Mucosa respiratoria estremamente sottile e poco vascolarizzata","Mucosa olfattiva spessa","Epitelio pavimentoso cheratinizzato","Mucosa respiratoria spessa e molto vascolarizzata come nelle cavità nasali"],"e":"A differenza delle cavità nasali propriamente dette, nei seni la mucosa è sottile e poco vascolarizzata."},{"t":12,"q":"Perché i seni paranasali possono essere coinvolti nei processi infiammatori delle vie respiratorie superiori?","o":["Perché comunicano direttamente con le cavità nasali e ne sono in continuità","Perché contengono la tonsilla faringea","Perché sono la sede dell'epitelio olfattivo","Perché ricevono il drenaggio lacrimale"],"e":"La continuità con la cavità nasale permette la propagazione dell'infiammazione ai seni."},{"t":13,"q":"Dove si trova la ghiandola nasale laterale?","o":["Nel recesso mascellare, a livello del quarto premolare superiore","Nel setto nasale, accanto all'organo vomeronasale","Nella rinofaringe, dorsalmente al palato molle","Nel vestibolo nasale, nel diverticolo del cavallo"],"e":"La ghiandola nasale laterale è localizzata nel recesso mascellare, in corrispondenza del quarto premolare superiore."},{"t":13,"q":"In quali animali è principalmente sviluppata la ghiandola nasale laterale?","o":["Nei carnivori, in particolare nel cane","Negli Equidi","Nei ruminanti","Nei suini"],"e":"Nel cane è legata alla termoregolazione e al naso umido tipico dell'animale sano."},{"t":13,"q":"La funzione della ghiandola nasale laterale è collegata a:","o":["La termoregolazione, tramite l'evaporazione di secrezioni a livello del naso","La percezione dei feromoni","La produzione di IgA per la difesa immunitaria","Il drenaggio delle lacrime"],"e":"Nel cane partecipa ai meccanismi di regolazione della temperatura corporea."},{"t":13,"q":"Il dotto nasolacrimale trasporta:","o":["La secrezione sierosa dal sacco congiuntivale al vestibolo nasale","Il muco dalla cavità nasale alla faringe","Il secreto della ghiandola nasale laterale al recesso mascellare","Le sostanze chimiche dalla cavità orale all'organo vomeronasale"],"e":"Collega l'apparato lacrimale alla cavità nasale: parte delle secrezioni oculari viene drenata verso il naso."},{"t":13,"q":"Da cosa dipende il naso umido del cane sano?","o":["Dalle secrezioni combinate delle ghiandole lacrimali, drenate dal dotto nasolacrimale, e delle ghiandole nasali laterali","Solo dal muco prodotto dalle cellule caliciformi","Dalla condensazione dell'aria espirata","Dal secreto dell'organo vomeronasale"],"e":"L'umidità non dipende solo da secrezioni prodotte localmente nel naso, ma anche dal drenaggio lacrimale."},{"t":14,"q":"Quali sono le cinque funzioni principali delle cavità nasali riassunte dal corso?","o":["Riscaldare l'aria, umidificarla, filtrarla, rimuovere il muco verso la faringe, permettere l'olfatto","Produrre surfattante, scambiare gas, regolare il pH, deglutire, fonare","Riscaldare l'aria, produrre lacrime, percepire feromoni, masticare, deglutire","Filtrare il sangue, umidificare l'aria, alleggerire il cranio, risuonare, permettere l'olfatto"],"e":"Le cavità nasali condizionano e depurano l'aria prima che entri nelle vie inferiori, oltre a svolgere la funzione olfattiva."},{"t":14,"q":"Come avviene il riscaldamento dell'aria nelle cavità nasali?","o":["Per scambio di calore tra il sangue della mucosa riccamente vascolarizzata e l'aria inspirata","Per attrito dell'aria contro le conche ossee","Per evaporazione della componente sierosa del muco","Per contrazione della muscolatura striata della rinofaringe"],"e":"La ricca vascolarizzazione della mucosa è la base del riscaldamento; l'evaporazione della componente sierosa serve invece all'umidificazione."},{"t":14,"q":"Come avviene l'umidificazione dell'aria inspirata e a quale livello arriva?","o":["Per evaporazione della componente sierosa della mucosa nasale, fino al 100% di umidità relativa","Per secrezione di muco acido, fino al 50%","Per condensazione del vapore espirato, fino al 70%","Per passaggio di acqua dai seni paranasali, fino all'80%"],"e":"L'aria che raggiunge i polmoni deve essere calda e satura d'umidità per non danneggiare gli epiteli respiratori profondi."},{"t":14,"q":"Quando l'aria passa attraverso la cavità orale invece che attraverso le cavità nasali:","o":["Il contatto tra aria e mucosa è meno esteso, quindi riscaldamento e umidificazione sono meno efficaci","L'aria viene filtrata meglio grazie alla saliva","L'aria viene riscaldata di più grazie alla lingua","Non vi è alcuna differenza nel condizionamento dell'aria"],"e":"La cavità orale è una via aerifera superiore «secondaria» proprio per la minore superficie di contatto aria-mucosa."},{"t":14,"q":"In quali condizioni la respirazione orale diventa importante?","o":["In caso di parziale ostacolo nelle cavità nasali e per incrementare la ventilazione durante lo sforzo fisico","Solo durante il sonno","Durante la percezione dei feromoni","Quando l'aria è già calda e umida"],"e":"Permette all'aria di raggiungere le vie inferiori e di introdurre maggiori volumi durante lo sforzo, con l'eccezione del cavallo."},{"t":14,"q":"Perché il cavallo rappresenta un'eccezione riguardo alla respirazione orale?","o":["È un respiratore nasale obbligato e non può respirare efficacemente attraverso la bocca","Perché possiede dotti incisivi più ampi","Perché la sua cavità orale è priva di mucosa","Perché ha una tonsilla faringea molto sviluppata"],"e":"Il cavallo non può aumentare la ventilazione con la bocca durante lo sforzo, a differenza di altre specie."},{"t":15,"q":"La coana è:","o":["L'apertura che mette in comunicazione la cavità nasale con la rinofaringe","L'apertura esterna della cavità nasale","L'apertura del meato medio nei seni paranasali","L'orifizio del dotto nasolacrimale nel vestibolo"],"e":"Dopo cavità nasali e meati, l'aria attraversa le coane e raggiunge la rinofaringe."},{"t":15,"q":"Perché è significativa la presenza di noduli linfatici vicino alla coana?","o":["Indica tessuto immunitario in una zona strategica, attraversata continuamente da aria potenzialmente ricca di particelle, microrganismi e antigeni","Indica la sede di produzione dei linfociti T","È dovuta al drenaggio delle lacrime","Segnala la presenza dell'epitelio olfattivo"],"e":"Il tessuto linfatico intercetta gli antigeni all'ingresso della via aerifera profonda; i linfociti T maturano nel timo."},{"t":15,"q":"La rinofaringe si trova:","o":["Dorsalmente al palato molle","Ventralmente al palato duro","Nello spessore dell'osso etmoide","Rostralmente alle narici"],"e":"È la porzione nasale della faringe, che riceve l'aria dalle coane."},{"t":15,"q":"Quale epitelio riveste la rinofaringe?","o":["Epitelio respiratorio, che diventa pavimentoso stratificato nella porzione caudo-dorsale del palato molle","Epitelio olfattivo in tutta l'estensione","Epitelio pavimentoso cheratinizzato in tutta l'estensione","Epitelio cubico semplice"],"e":"La mucosa della rinofaringe è respiratoria; la transizione a epitelio pavimentoso stratificato riguarda solo la porzione caudo-dorsale del palato molle."},{"t":15,"q":"La tonaca muscolare della rinofaringe è costituita da:","o":["Muscolatura striata","Muscolatura liscia","Cartilagine ialina","Tessuto elastico privo di fibre muscolari"],"e":"La parete comprende mucosa con epitelio respiratorio, propria-sottomucosa lassa con ghiandole miste, tonaca muscolare striata e tonaca avventizia."},{"t":15,"q":"I noduli linfatici diffusi e aggregati della porzione caudale della rinofaringe formano:","o":["La tonsilla faringea","Le placche di Peyer","La tonsilla palatina","Il timo"],"e":"La rinofaringe è anche sede di difesa immunitaria: la tonsilla faringea intercetta antigeni e microrganismi dell'aria inspirata."},{"t":16,"q":"Quali sono gli organi linfatici primari?","o":["Midollo osseo e timo, in cui i linfociti vengono prodotti o maturano senza incontrare antigeni esterni","Linfonodi e milza","Tonsille e placche di Peyer","Fegato e rene dell'adulto"],"e":"Gli organi secondari (linfonodi, milza, MALT) sono colonizzati da linfociti già maturi che vi incontrano gli antigeni."},{"t":16,"q":"Il timo è responsabile di:","o":["La maturazione dei linfociti T","L'emopoiesi adulta","La produzione di anticorpi da parte delle plasmacellule","La filtrazione della linfa"],"e":"Il midollo osseo è la sede dell'emopoiesi adulta; il timo fa maturare i linfociti T."},{"t":16,"q":"Il MALT (tessuto linfatico associato alle mucose) comprende ad esempio:","o":["Tonsille e placche di Peyer dell'intestino","Timo e midollo osseo","Milza e fegato fetale","Sacco vitellino e milza"],"e":"Il MALT è un organo linfatico secondario distribuito nelle mucose."},{"t":16,"q":"Come cambia la sede dell'ematopoiesi durante lo sviluppo?","o":["Sacco vitellino → fegato fetale (e in parte milza) → midollo osseo dopo la nascita (ossa lunghe, sterno, coste, corpi vertebrali)","Midollo osseo → fegato fetale → timo","Timo → milza → linfonodi","Fegato fetale → sacco vitellino → midollo osseo"],"e":"Con lo sviluppo dello scheletro, la funzione ematopoietica passa progressivamente al midollo osseo."}];
const N = DATA.length;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let opts, answers, order, pos, filter = 'all', shuffled = false, showingSummary = false, resetArmed = null;

function init() {
  // Per ogni domanda le opzioni vengono mescolate una volta; l'opzione corretta e' l'indice 0 nei dati.
  opts = DATA.map(q => shuffle(q.o.map((t, i) => ({ t, c: i === 0 }))));
  answers = new Array(N).fill(null);
  buildOrder();
}

function buildOrder() {
  order = DATA.map((_, i) => i).filter(i => filter === 'all' || DATA[i].t === filter);
  if (shuffled) shuffle(order);
  const firstOpen = order.findIndex(i => answers[i] === null);
  pos = firstOpen === -1 ? 0 : firstOpen;
}

function renderTopics() {
  const counts = DATA.reduce((m, q) => (m[q.t] = (m[q.t] || 0) + 1, m), {});
  let h = '<option value="all">Tutti gli argomenti (100)</option>';
  TOPICS.forEach((name, i) => { h += `<option value="${i}">${esc(name)} (${counts[i] || 0})</option>`; });
  $('topic').innerHTML = h;
}

function renderStats() {
  const done = answers.filter(a => a !== null).length;
  const ok = answers.reduce((n, a, i) => n + (a !== null && opts[i][a].c ? 1 : 0), 0);
  $('sAns').textContent = done;
  $('sOk').textContent = ok;
}

function renderMap() {
  $('map').innerHTML = order.map((i, k) => {
    const a = answers[i];
    let cls = 'seg';
    if (a !== null) cls += opts[i][a].c ? ' ok' : ' ko';
    if (k === pos && !showingSummary) cls += ' cur';
    return `<button class="${cls}" data-k="${k}" aria-label="Domanda ${k + 1}"></button>`;
  }).join('');
}

function renderCard() {
  const i = order[pos], q = DATA[i], a = answers[i], done = a !== null;
  let h = `<div class="meta"><span class="topic">${esc(TOPICS[q.t])}</span><span>Domanda ${pos + 1} di ${order.length}</span></div>`;
  h += `<p class="q">${esc(q.q)}</p><div class="opts">`;
  opts[i].forEach((o, k) => {
    let cls = 'opt';
    if (done) { if (o.c) cls += ' ok'; else if (k === a) cls += ' ko'; }
    h += `<button class="${cls}" data-k="${k}" ${done ? 'disabled' : ''}><span class="key">${k + 1}</span><span>${esc(o.t)}</span></button>`;
  });
  h += '</div>';
  if (done) {
    h += opts[i][a].c
      ? '<div class="fb ok" role="status"><b>Corretto.</b></div>'
      : `<div class="fb ko" role="status"><b>Sbagliato.</b>${esc(q.e)}</div>`;
  }
  $('card').innerHTML = h;
}

function renderNav() {
  $('prev').disabled = pos === 0;
  const last = pos === order.length - 1;
  $('next').textContent = last ? 'Vai al riepilogo' : 'Successiva';
  $('shuffle').textContent = shuffled ? 'Ripristina l\'ordine' : 'Mescola le domande';
  $('review').textContent = showingSummary ? 'Torna alle domande' : 'Riepilogo';
}

function renderSummary() {
  const set = order;
  const done = set.filter(i => answers[i] !== null);
  const ok = done.filter(i => opts[i][answers[i]].c);
  const pct = done.length ? Math.round(ok.length / done.length * 100) : 0;
  let h = `<h2>Riepilogo</h2><div class="score">${ok.length} / ${done.length}<small>${pct}% delle risposte date</small></div>`;
  if (done.length < set.length) h += `<p class="empty">${set.length - done.length} domande ancora senza risposta.</p>`;

  const byTopic = {};
  set.forEach(i => {
    const t = DATA[i].t;
    byTopic[t] = byTopic[t] || { tot: 0, done: 0, ok: 0 };
    byTopic[t].tot++;
    if (answers[i] !== null) { byTopic[t].done++; if (opts[i][answers[i]].c) byTopic[t].ok++; }
  });
  Object.keys(byTopic).sort((a, b) => a - b).forEach(t => {
    const r = byTopic[t];
    const w = r.tot ? Math.round(r.ok / r.tot * 100) : 0;
    h += `<div class="trow"><span>${esc(TOPICS[t])}</span><span>${r.ok} / ${r.tot}</span><div class="track"><div class="fill" style="width:${w}%"></div></div></div>`;
  });

  const wrong = done.filter(i => !opts[i][answers[i]].c);
  h += `<h3>Da rivedere (${wrong.length})</h3>`;
  if (!wrong.length) h += '<p class="empty">Nessun errore nelle risposte date.</p>';
  wrong.forEach(i => {
    const q = DATA[i], mine = opts[i][answers[i]].t, right = opts[i].find(o => o.c).t;
    h += `<div class="err"><p class="qq">${esc(q.q)}</p><p class="ko">Tua risposta: ${esc(mine)}</p><p class="ok">Risposta corretta: ${esc(right)}</p><p class="why">${esc(q.e)}</p></div>`;
  });
  $('summary').innerHTML = h;
}

function render() {
  renderStats(); renderMap(); renderNav();
  $('card').classList.toggle('hidden', showingSummary);
  $('nav').classList.toggle('hidden', showingSummary);
  $('summary').classList.toggle('hidden', !showingSummary);
  if (showingSummary) renderSummary(); else renderCard();
}

function goTo(k) { showingSummary = false; pos = Math.max(0, Math.min(order.length - 1, k)); render(); }

function answer(k) {
  const i = order[pos];
  if (answers[i] !== null || k < 0 || k >= opts[i].length) return;
  answers[i] = k;
  render();
}

$('card').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b && !b.disabled) answer(+b.dataset.k); });
$('map').addEventListener('click', e => { const b = e.target.closest('.seg'); if (b) goTo(+b.dataset.k); });
$('prev').addEventListener('click', () => goTo(pos - 1));
$('next').addEventListener('click', () => { if (pos === order.length - 1) { showingSummary = true; render(); } else goTo(pos + 1); });
$('review').addEventListener('click', () => { showingSummary = !showingSummary; render(); });
$('shuffle').addEventListener('click', () => { shuffled = !shuffled; buildOrder(); showingSummary = false; render(); });
$('topic').addEventListener('change', e => { filter = e.target.value === 'all' ? 'all' : +e.target.value; buildOrder(); showingSummary = false; render(); });
$('reset').addEventListener('click', () => {
  if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; $('reset').textContent = 'Ricomincia'; init(); showingSummary = false; render(); return; }
  $('reset').textContent = 'Confermi? Tocca di nuovo';
  resetArmed = setTimeout(() => { resetArmed = null; $('reset').textContent = 'Ricomincia'; }, 4000);
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key >= '1' && e.key <= '4' && !showingSummary) answer(+e.key - 1);
  else if (e.key === 'ArrowRight' && !showingSummary) $('next').click();
  else if (e.key === 'ArrowLeft' && !showingSummary) goTo(pos - 1);
});

init(); renderTopics(); render();
</script>
</body>
</html>
